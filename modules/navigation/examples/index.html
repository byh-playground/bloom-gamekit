<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Navigation example</title>
<h1>화면 이동</h1>
<button id="wiki">위키</button><button id="skill">기술</button><button id="main">메인</button
><button id="back">뒤로</button><output id="screen"></output>
<script type="module">
    import { createNavigation } from '../../../dist/navigation.js';
    const NAV = createNavigation();
    window.navigationDemo = NAV;
    NAV.subscribe(
        (route) => {
            document.querySelector('#screen').textContent = route.screen + '/' + (route.item ?? '') + '?' + route.query;
        },
        {
            immediate: true,
        },
    );
    document.querySelector('#wiki').onclick = () =>
        NAV.navigate({
            screen: 'wiki',
            query: 'section=rules',
        });
    document.querySelector('#skill').onclick = () =>
        NAV.navigate({
            screen: 'tech',
            item: 'iceGarden',
        });
    document.querySelector('#main').onclick = () =>
        NAV.replace({
            screen: 'main',
        });
    document.querySelector('#back').onclick = () => NAV.back();
    addEventListener('pagehide', () => NAV.dispose(), {
        once: true,
    });
</script>
