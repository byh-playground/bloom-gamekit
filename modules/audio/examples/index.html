<!doctype html>
<html lang="ko">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameKit 오디오</title
    ><style>
        body {
            background: #102025;
            color: #d8efe5;
            font: 16px system-ui;
            max-width: 720px;
            margin: 50px auto;
            padding: 20px;
        }
        button,
        input {
            margin: 8px;
            padding: 12px;
        }
        pre {
            white-space: pre-wrap;
        }
        label {
            display: block;
        }
    </style>
    <h1>이벤트 오디오</h1>
    <p>재생 제스처로 잠금을 해제합니다. 직접 재생과 confirmed journal을 같은 player에 연결합니다.</p>
    <button id="tap">직접 타격</button
    ><button id="confirmed">확정 타격</button
    ><button id="dense">밀집 + 중요 경고</button
    ><button id="mute">음소거</button
    ><label>음량 <input id="volume" type="range" min="0" max="100" value="70" /></label>
    <pre id="status"></pre>
    <script type="module">
        import { AudioPlayer } from '../../../dist/audio.js';
        import { PresentationEventQueue } from '../../../dist/presentation-events.js';
        const CONFIG = {
            storageKey: 'gamekit-audio-example',
            maxVoices: 4,
            categories: {
                impact: {
                    volume: 1,
                    max: 3,
                    gapMs: 0,
                    priority: 1,
                },
                danger: {
                    volume: 0.8,
                    max: 3,
                    gapMs: 0,
                    priority: 5,
                },
            },
            sounds: {
                hit: {
                    category: 'impact',
                    layers: [
                        {
                            kind: 'tone',
                            hz: 180,
                            end: 50,
                            ms: 260,
                            gain: 0.22,
                            type: 'sine',
                        },
                        {
                            kind: 'noise',
                            hz: 2200,
                            ms: 80,
                            gain: 0.13,
                        },
                    ],
                },
                warning: {
                    category: 'danger',
                    priority: 8,
                    layers: [
                        {
                            kind: 'tone',
                            hz: 660,
                            end: 880,
                            ms: 300,
                            gain: 0.18,
                            type: 'triangle',
                        },
                    ],
                },
            },
        };
        const PLAYER = new AudioPlayer(CONFIG);
        let tick = 0;
        const JOURNAL = new PresentationEventQueue({
            adapters: {
                sfx: PLAYER.createAdapter({
                    onEnded: (event) => JOURNAL.finish(event),
                }),
            },
        });
        const STATUS = () => {
            document.querySelector('#status').textContent = JSON.stringify(PLAYER.snapshot(), null, 2);
            document.querySelector('#volume').value = Math.round(PLAYER.volume * 100);
            document.querySelector('#mute').textContent = PLAYER.muted ? '음소거 해제' : '음소거';
        };
        document.querySelector('#tap').onclick = async () => {
            await PLAYER.unlock();
            PLAYER.play('hit');
            STATUS();
            setTimeout(STATUS, 400);
        };
        document.querySelector('#confirmed').onclick = async () => {
            await PLAYER.unlock();
            const EVENT = {
                tick: tick++,
                sequence: 0,
                entityId: 'demo',
                generation: 0,
                kind: 'sfx',
                payload: {
                    soundId: 'hit',
                },
                policy: 'confirmed',
            };
            JOURNAL.emit(EVENT);
            JOURNAL.confirmThrough(EVENT.tick);
            JOURNAL.emit(EVENT);
            STATUS();
            setTimeout(STATUS, 400);
        };
        document.querySelector('#dense').onclick = async () => {
            await PLAYER.unlock();
            for (let i = 0; i < 20; i++) {
                PLAYER.play('hit');
            }
            for (let i = 0; i < 3; i++) {
                PLAYER.play('warning');
            }
            STATUS();
            setTimeout(STATUS, 450);
        };
        document.querySelector('#mute').onclick = () => {
            PLAYER.setMuted(!PLAYER.muted);
            STATUS();
        };
        document.querySelector('#volume').oninput = (e) => {
            PLAYER.setVolume(Number(e.target.value) / 100);
            STATUS();
        };
        window.audioExample = {
            player: PLAYER,
            journal: JOURNAL,
            config: CONFIG,
        };
        window.addEventListener('pagehide', () => {
            JOURNAL.dispose();
            void PLAYER.dispose();
        });
        STATUS();
    </script>
</html>
