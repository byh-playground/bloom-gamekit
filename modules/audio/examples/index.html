<!doctype html>
<html lang="ko">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameKit 오디오</title
    ><style>
        body {
            background: #102025;
            color: #d8efe5;
            font: 16px system-ui;
            max-width: 720px;
            margin: 50px auto;
            padding: 20px;
        }
        button,
        input {
            margin: 8px;
            padding: 12px;
            min-height: 56px;
        }
        pre {
            white-space: pre-wrap;
        }
        label {
            display: block;
        }
    </style>
    <h1>이벤트 오디오</h1>
    <p>짧은 소리는 한 번 재생하고, 환경음은 켜 두고 키우거나 줄입니다.</p>
    <button id="tap">직접 타격</button
    ><button id="confirmed">확정 타격</button
    ><button id="dense">밀집 + 중요 경고</button
    ><button id="left">왼쪽 타격</button
    ><button id="right">오른쪽 타격</button
    ><button id="bed">환경음 켜기</button
    ><button id="swell">환호</button
    ><button id="mute">음소거</button
    ><label>음량 <input id="volume" type="range" min="0" max="100" value="70" /></label>
    <pre id="status"></pre>
    <script type="module">
        import { AudioPlayer } from '../../../dist/audio.js';
        import { PresentationEventQueue } from '../../../dist/presentation-events.js';
        const CONFIG = {
            storageKey: 'gamekit-audio-example',
            maxVoices: 4,
            categories: {
                impact: {
                    volume: 1,
                    max: 3,
                    gapMs: 0,
                    priority: 1,
                },
                danger: {
                    volume: 0.8,
                    max: 3,
                    gapMs: 0,
                    priority: 5,
                },
                ambience: {
                    volume: 0.8,
                    max: 1,
                    gapMs: 0,
                    priority: 0,
                },
            },
            synthesis: {
                noiseMs: 4000,
            },
            beds: {
                crowd: {
                    category: 'ambience',
                    layers: [
                        {
                            kind: 'noise',
                            type: 'bandpass',
                            hz: 480,
                            q: 0.9,
                            gain: 0.5,
                            pan: -0.6,
                            lfos: [
                                { hz: 0.22, depth: 0.25 },
                                { hz: 4.3, depth: 0.3 },
                            ],
                        },
                        {
                            kind: 'noise',
                            type: 'bandpass',
                            hz: 520,
                            q: 0.9,
                            gain: 0.5,
                            pan: 0.6,
                            offsetMs: 1700,
                            lfos: [
                                { hz: 0.31, depth: 0.25 },
                                { hz: 5.1, depth: 0.3 },
                            ],
                        },
                    ],
                },
            },
            sounds: {
                hit: {
                    category: 'impact',
                    layers: [
                        {
                            kind: 'tone',
                            hz: 180,
                            end: 50,
                            ms: 260,
                            gain: 0.22,
                            type: 'sine',
                        },
                        {
                            kind: 'noise',
                            hz: 2200,
                            ms: 80,
                            gain: 0.13,
                        },
                    ],
                },
                warning: {
                    category: 'danger',
                    priority: 8,
                    layers: [
                        {
                            kind: 'tone',
                            hz: 660,
                            end: 880,
                            ms: 300,
                            gain: 0.18,
                            type: 'triangle',
                        },
                    ],
                },
            },
        };
        const PLAYER = new AudioPlayer(CONFIG);
        let tick = 0;
        const JOURNAL = new PresentationEventQueue({
            adapters: {
                sfx: PLAYER.createAdapter({
                    onEnded: (event) => JOURNAL.finish(event),
                }),
            },
        });
        const STATUS = () => {
            document.querySelector('#status').textContent = JSON.stringify(PLAYER.snapshot(), null, 2);
            document.querySelector('#volume').value = Math.round(PLAYER.volume * 100);
            document.querySelector('#mute').textContent = PLAYER.muted ? '음소거 해제' : '음소거';
        };
        document.querySelector('#tap').onclick = async () => {
            await PLAYER.unlock();
            PLAYER.play('hit');
            STATUS();
            setTimeout(STATUS, 400);
        };
        document.querySelector('#confirmed').onclick = async () => {
            await PLAYER.unlock();
            const EVENT = {
                tick: tick++,
                sequence: 0,
                entityId: 'demo',
                generation: 0,
                kind: 'sfx',
                payload: {
                    soundId: 'hit',
                },
                policy: 'confirmed',
            };
            JOURNAL.emit(EVENT);
            JOURNAL.confirmThrough(EVENT.tick);
            JOURNAL.emit(EVENT);
            STATUS();
            setTimeout(STATUS, 400);
        };
        document.querySelector('#dense').onclick = async () => {
            await PLAYER.unlock();
            for (let i = 0; i < 20; i++) {
                PLAYER.play('hit');
            }
            for (let i = 0; i < 3; i++) {
                PLAYER.play('warning');
            }
            STATUS();
            setTimeout(STATUS, 450);
        };
        // pan/detune은 호출자가 정한다. 모듈은 난수를 만들지 않는다.
        const HIT_AT = async (pan) => {
            await PLAYER.unlock();
            PLAYER.start('hit', 1, { pan, detune: (Math.random() - 0.5) * 120 });
            STATUS();
            setTimeout(STATUS, 400);
        };
        document.querySelector('#left').onclick = () => HIT_AT(-0.8);
        document.querySelector('#right').onclick = () => HIT_AT(0.8);
        let bed = null;
        document.querySelector('#bed').onclick = async () => {
            if (bed) {
                bed.stop(500);
                bed = null;
            } else {
                await PLAYER.unlock();
                bed = PLAYER.startBed('crowd', { level: 0.6, fadeMs: 600 });
            }
            document.querySelector('#bed').textContent = bed ? '환경음 끄기' : '환경음 켜기';
            STATUS();
        };
        document.querySelector('#swell').onclick = () => {
            bed?.swell(1.2, 120, 1200);
            STATUS();
        };
        document.querySelector('#mute').onclick = () => {
            PLAYER.setMuted(!PLAYER.muted);
            STATUS();
        };
        document.querySelector('#volume').oninput = (e) => {
            PLAYER.setVolume(Number(e.target.value) / 100);
            STATUS();
        };
        window.audioExample = {
            player: PLAYER,
            journal: JOURNAL,
            config: CONFIG,
        };
        window.addEventListener('pagehide', () => {
            JOURNAL.dispose();
            void PLAYER.dispose();
        });
        STATUS();
    </script>
</html>
