<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameKit yarn stream benchmark</title>
<style>
    body {
        margin: 0;
        background: #101923;
        color: #dce8f1;
        font:
            15px system-ui,
            sans-serif;
    }
    main {
        max-width: 960px;
        margin: 0 auto;
        padding: 10px 14px 24px;
    }
    CANVAS {
        display: block;
        width: min(100%, 960px);
        height: auto;
        border: 1px solid #526374;
        border-radius: 12px;
    }
    pre {
        white-space: pre-wrap;
        color: #a9bdcb;
    }
</style>
<main>
    <h1>털실 표면의 정점 스트림 편입 비교</h1>
    <p>
        현재 구조(표면별 draw)와, 털실을 정점 스트림에 넣는 두 구성(S: 일반·털실 프로그램 전환, U: 한 프로그램의 모드
        분기)을 같은 장면에서 비교합니다. 셰이더 소스는 실제 모듈이 컴파일하는 것을 가로채 씁니다.
    </p>
    <canvas id="scene" width="1280" height="720"></canvas>
    <pre id="result"></pre>
</main>
<script type="module">
    // Shader sources are captured from the real VectorRenderer and YarnSurfaceRenderer so the benchmark never copies
    // them. All three configurations draw through raw WebGL 2 on one CANVAS with identical vertex data.
    const CAPTURED = [];
    const ORIGINAL_SHADER_SOURCE = WebGL2RenderingContext.prototype.shaderSource;
    WebGL2RenderingContext.prototype.shaderSource = function (shader, source) {
        CAPTURED.push(source);
        return ORIGINAL_SHADER_SOURCE.call(this, shader, source);
    };
    const {
        WebGLDevice: WEB_GL_DEVICE,
        VectorRenderer: VECTOR_RENDERER,
        YarnSurfaceRenderer: YARN_SURFACE_RENDERER,
        buildYarnSurfaceGeometry: BUILD_YARN_SURFACE_GEOMETRY,
    } = await import('/dist/rendering.js');

    const VERTEX_FLOATS = 20;
    const MODE_YARN = 6;
    const MODE_SKETCH = 7;
    const SKETCH_TIME_MS = 1234;
    const SURFACE_TEXELS = 8;
    const STYLE_BASE = {
        kind: 'yarn',
        seed: 41,
        stitchWidth: 14.4,
        stitchHeight: 15.6,
        thickness: 0.4102564103,
        irregularity: 0.13,
        contrast: 0.23,
        edgeSpacing: 10,
        edgeRelief: 3.04,
        edgeWidth: 3.92,
        fiberLength: 8.8,
        fiberWidth: 0.88,
        fiberOpacity: 0.65,
        fiberSpacing: 4,
        fiberMax: 155,
        curved: true,
        pattern: true,
        detail: false,
        fiber: true,
    };
    // The stitch scale in STYLE_BASE is authored for a radius of about 60 source units.
    const STYLE_FOR = (radius, thickness = STYLE_BASE.thickness) => {
        const K = radius / 60;
        return {
            ...STYLE_BASE,
            stitchWidth: STYLE_BASE.stitchWidth * K,
            stitchHeight: STYLE_BASE.stitchHeight * K,
            edgeSpacing: STYLE_BASE.edgeSpacing * K,
            edgeRelief: STYLE_BASE.edgeRelief * K,
            edgeWidth: STYLE_BASE.edgeWidth * K,
            fiberLength: STYLE_BASE.fiberLength * K,
            fiberWidth: STYLE_BASE.fiberWidth * K,
            fiberSpacing: STYLE_BASE.fiberSpacing * K,
            thickness,
        };
    };
    // Shipped sketch-fox style; lengths scale with the surface radius like the yarn stitch sizes.
    const SKETCH_STYLE_BASE = {
        kind: 'sketch',
        seed: 73,
        periodMs: 135,
        amplitude: 1.3,
        frequency: 4,
        echoX: 1.1,
        echoY: -0.8,
        echoWidth: 1.4,
        echoOpacity: 0.24,
        hatchAngle: 0.72,
        hatchSpacing: 7,
        hatchWidth: 0.8,
        hatchOpacity: 0.36,
    };
    const SKETCH_STYLE_FOR = (radius) => {
        const K = radius / 60;
        return {
            ...SKETCH_STYLE_BASE,
            amplitude: SKETCH_STYLE_BASE.amplitude * K,
            echoX: SKETCH_STYLE_BASE.echoX * K,
            echoY: SKETCH_STYLE_BASE.echoY * K,
            echoWidth: SKETCH_STYLE_BASE.echoWidth * K,
            hatchSpacing: SKETCH_STYLE_BASE.hatchSpacing * K,
            hatchWidth: SKETCH_STYLE_BASE.hatchWidth * K,
        };
    };
    const SURFACE_INPUT = (points, radius, thickness, material = 'yarn') => {
        const OUTLINE = [];
        for (let i = 0; i < points; i++) {
            const A = (i / points) * Math.PI * 2;
            OUTLINE.push(Math.cos(A) * radius, Math.sin(A) * radius * 1.1);
        }
        const FILL = [];
        for (let i = 0; i < points; i++) {
            const A = (i / points) * Math.PI * 2,
                B = ((i + 1) / points) * Math.PI * 2;
            FILL.push(0, 0, 0.84, 0.49, 0.29, 1);
            FILL.push(Math.cos(A) * radius, Math.sin(A) * radius * 1.1, 0.84, 0.49, 0.29, 1);
            FILL.push(Math.cos(B) * radius, Math.sin(B) * radius * 1.1, 0.84, 0.49, 0.29, 1);
        }
        const COLORS = [];
        for (let i = 0; i < points; i++) {
            const T = i / points;
            COLORS.push(0.82 - T * 0.12, 0.48 - T * 0.08, 0.28 - T * 0.06, 1);
        }
        return {
            fillVertices: Float32Array.from(FILL),
            outline: Float32Array.from(OUTLINE),
            edgeColors: Float32Array.from(COLORS),
            style: material === 'sketch' ? SKETCH_STYLE_FOR(radius) : STYLE_FOR(radius, thickness),
        };
    };

    // --- Capture the real shaders -------------------------------------------------------------------------------
    const PROBE = document.createElement('canvas');
    const PROBE_DEVICE = new WEB_GL_DEVICE(PROBE, { alpha: true, depth: false, stencil: true });
    new VECTOR_RENDERER(PROBE_DEVICE);
    const PROBE_YARN = new YARN_SURFACE_RENDERER(PROBE_DEVICE);
    PROBE_YARN.createSurface(SURFACE_INPUT(24, 32));
    PROBE_YARN.createSurface(SURFACE_INPUT(24, 32, undefined, 'sketch'));
    const FIND = (test, label) => {
        const SOURCE = CAPTURED.find(test);
        if (!SOURCE) {
            throw new Error('Could not capture ' + label);
        }
        return SOURCE;
    };
    const STREAM_VS = FIND(
        (s) => s.includes('a_rect') && s.includes('a_radial') && !s.includes('poseEval'),
        'stream vertex shader',
    );
    const STREAM_FS = FIND(
        (s) => s.includes('primitiveOutside') && !s.includes('u_planeCount'),
        'stream fragment shader',
    );
    const YARN_VS = FIND(
        (s) => s.includes('a_surface') && s.includes('u_transform') && !s.includes('u_viewProjection'),
        'yarn vertex shader',
    );
    const YARN_FS = FIND((s) => s.includes('shadeYarnFill'), 'yarn fragment shader');
    const SKETCH_FS = FIND((s) => s.includes('shadeSketchFill'), 'sketch fragment shader');
    const BODY_START = YARN_FS.indexOf('float hashCell(');
    if (BODY_START < 0) {
        throw new Error('Yarn fragment body marker not found');
    }
    const YARN_BODY = YARN_FS.slice(BODY_START)
        .replace(/clipWorld\(\);/g, '')
        .replace(/void\s+main\s*\(\s*\)/, 'void yarnMain()');
    // Sketch shares the helper block with yarn; only its two shading functions and main differ.
    const SKETCH_START = SKETCH_FS.indexOf('vec3 shadeSketchFill(');
    const SKETCH_HELPERS = SKETCH_FS.indexOf('float hashCell(');
    if (SKETCH_START < 0 || SKETCH_HELPERS < 0) {
        throw new Error('Sketch fragment markers not found');
    }
    const SKETCH_RENAME = (text) =>
        text.replace(/clipWorld\(\);/g, '').replace(/void\s+main\s*\(\s*\)/, 'void sketchMain()');
    const SKETCH_FUNCTIONS = SKETCH_RENAME(SKETCH_FS.slice(SKETCH_START));
    const SKETCH_BODY_ONLY = SKETCH_RENAME(SKETCH_FS.slice(SKETCH_HELPERS));
    // The field sampler is declared here for sources built from the shader body once the module ships the field.
    const SURFACE_GLOBALS = `
${YARN_FS.includes('u_stitchField') ? 'uniform mediump sampler2D u_stitchField;' : ''}
#define v_position v_uv
#define v_surface v_radial.xyz
vec4 u_bounds; vec4 u_effect0; vec4 u_effect1; vec4 u_effect2; vec4 u_effect3; vec4 u_tint; float u_flash; float u_forceColor; float u_timeMs;
uniform highp sampler2D u_surfaceData;
void loadSurface(int id) {
  u_bounds = texelFetch(u_surfaceData, ivec2(0, id), 0);
  u_effect0 = texelFetch(u_surfaceData, ivec2(1, id), 0);
  u_effect1 = texelFetch(u_surfaceData, ivec2(2, id), 0);
  u_effect2 = texelFetch(u_surfaceData, ivec2(3, id), 0);
  u_effect3 = texelFetch(u_surfaceData, ivec2(4, id), 0);
  u_tint = texelFetch(u_surfaceData, ivec2(5, id), 0);
  vec4 misc = texelFetch(u_surfaceData, ivec2(6, id), 0);
  u_flash = misc.x;
  u_forceColor = misc.y;
  u_timeMs = misc.z;
}
`;
    const STREAM_VARYINGS =
        'in highp vec2 v_uv; in vec4 v_color; in highp vec4 v_paint; in highp vec4 v_radial; in highp vec4 v_rect;';
    const UBER_FS =
        STREAM_FS.replace(/void\s+main\s*\(\s*\)/, 'void streamMain()') +
        SURFACE_GLOBALS +
        YARN_BODY +
        `
void main() {
  if (v_paint.z > 5.5) {
    loadSurface(int(v_paint.x + 0.5));
    yarnMain();
  } else {
    streamMain();
  }
}
`;
    const YARN_STREAM_FS =
        '#version 300 es\nprecision mediump float;\nout vec4 _deviceFragColor;\n' +
        STREAM_VARYINGS +
        SURFACE_GLOBALS +
        YARN_BODY +
        `
void main() {
  loadSurface(int(v_paint.x + 0.5));
  yarnMain();
}
`;
    // Material dispatch: one stream program, the surface kind only selects the shading function.
    const UBER_FS_BOTH =
        STREAM_FS.replace(/void\s+main\s*\(\s*\)/, 'void streamMain()') +
        SURFACE_GLOBALS +
        YARN_BODY +
        SKETCH_FUNCTIONS +
        `
void main() {
  if (v_paint.z > 5.5) {
    loadSurface(int(v_paint.x + 0.5));
    if (v_paint.z > 6.5) {
      sketchMain();
    } else {
      yarnMain();
    }
  } else {
    streamMain();
  }
}
`;
    const SKETCH_STREAM_FS =
        '#version 300 es\nprecision mediump float;\nout vec4 _deviceFragColor;\n' +
        STREAM_VARYINGS +
        SURFACE_GLOBALS +
        SKETCH_BODY_ONLY +
        `
void main() {
  loadSurface(int(v_paint.x + 0.5));
  sketchMain();
}
`;

    // --- Raw WebGL 2 helpers ----------------------------------------------------------------------------------
    const CANVAS = document.getElementById('scene');
    const GL = CANVAS.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        preserveDrawingBuffer: true,
        powerPreference: 'high-performance',
    });
    if (!GL) {
        throw new Error('WebGL 2 is required');
    }
    const DEBUG_RENDERER = GL.getExtension('WEBGL_debug_renderer_info');
    const RENDERER = DEBUG_RENDERER ? GL.getParameter(DEBUG_RENDERER.UNMASKED_RENDERER_WEBGL) : 'unknown';
    const TIMER = GL.getExtension('EXT_disjoint_timer_query_webgl2');
    GL.getExtension('EXT_color_buffer_float');
    const COMPILE = (type, source) => {
        const SHADER = GL.createShader(type);
        GL.shaderSource(SHADER, source);
        GL.compileShader(SHADER);
        if (!GL.getShaderParameter(SHADER, GL.COMPILE_STATUS)) {
            throw new Error(GL.getShaderInfoLog(SHADER) + '\n' + source.slice(0, 400));
        }
        return SHADER;
    };
    const MAKE_PROGRAM = (vertex, fragment, attributes) => {
        const PROGRAM = GL.createProgram();
        GL.attachShader(PROGRAM, COMPILE(GL.VERTEX_SHADER, vertex));
        GL.attachShader(PROGRAM, COMPILE(GL.FRAGMENT_SHADER, fragment));
        attributes.forEach((name, index) => GL.bindAttribLocation(PROGRAM, index, name));
        GL.linkProgram(PROGRAM);
        if (!GL.getProgramParameter(PROGRAM, GL.LINK_STATUS)) {
            throw new Error(GL.getProgramInfoLog(PROGRAM));
        }
        const UNIFORMS = new Map();
        const COUNT = GL.getProgramParameter(PROGRAM, GL.ACTIVE_UNIFORMS);
        for (let i = 0; i < COUNT; i++) {
            const INFO = GL.getActiveUniform(PROGRAM, i);
            UNIFORMS.set(INFO.name.replace('[0]', ''), {
                location: GL.getUniformLocation(PROGRAM, INFO.name),
                size: INFO.size,
            });
        }
        return { program: PROGRAM, uniforms: UNIFORMS };
    };
    const STREAM_ATTRIBUTES = ['a_position', 'a_uv', 'a_color', 'a_paint', 'a_radial', 'a_rect'];
    const SPRITE_PROGRAM = MAKE_PROGRAM(STREAM_VS, STREAM_FS, STREAM_ATTRIBUTES);
    const YARN_STREAM_PROGRAM = MAKE_PROGRAM(STREAM_VS, YARN_STREAM_FS, STREAM_ATTRIBUTES);
    const UBER_PROGRAM = MAKE_PROGRAM(STREAM_VS, UBER_FS, STREAM_ATTRIBUTES);
    const CURRENT_YARN_PROGRAM = MAKE_PROGRAM(YARN_VS, YARN_FS, ['a_position', 'a_color', 'a_surface']);

    // --- Stitch distance field prototype -----------------------------------------------------------------------
    // The fill shader evaluates seven cubicDistance calls per pixel for curves that never change: the two stitch
    // strands, the underside curve and the twist segments, each sampled at a few offsets. Their distances depend only
    // on the position inside one stitch cell, so one small shared texture can hold them. R = min(left, right strand),
    // G = underside, B = twist, in cell-normalized units divided by maxDistance. Strand masks use
    // max(lineMask(left), lineMask(right)) = lineMask(min(left, right)), so three samples replace the seven calls.
    const STITCH_FIELD = { size: 256, extent: 0.8, maxDistance: 0.25 };
    const STITCH_CURVES = {
        left: [
            [-0.34, -0.36],
            [-0.32, -0.06],
            [-0.18, 0.17],
            [-0.025, 0.34],
        ],
        right: [
            [0.34, -0.36],
            [0.32, -0.06],
            [0.18, 0.17],
            [0.025, 0.34],
        ],
        under: [
            [-0.48, -0.46],
            [-0.22, -0.57],
            [0.22, -0.57],
            [0.48, -0.46],
        ],
    };
    const STITCH_TWISTS = [
        [
            [-0.32, -0.12],
            [-0.16, -0.13],
        ],
        [
            [0.22, 0.18],
            [0.37, 0.08],
        ],
    ];
    const SEGMENT_DISTANCE = (px, py, a, b) => {
        const DX = b[0] - a[0],
            DY = b[1] - a[1];
        const T = Math.max(0, Math.min(1, ((px - a[0]) * DX + (py - a[1]) * DY) / Math.max(DX * DX + DY * DY, 1e-6)));
        return Math.hypot(px - (a[0] + DX * T), py - (a[1] + DY * T));
    };
    // The shader approximates each cubic with five segments; the field uses the same polyline.
    const CURVE_POLYLINE = ([a, b, c, d]) => {
        const POINTS = [a];
        for (let i = 1; i <= 5; i++) {
            const T = i * 0.2,
                S = 1 - T;
            POINTS.push([
                S * S * S * a[0] + 3 * S * S * T * b[0] + 3 * S * T * T * c[0] + T * T * T * d[0],
                S * S * S * a[1] + 3 * S * S * T * b[1] + 3 * S * T * T * c[1] + T * T * T * d[1],
            ]);
        }
        return POINTS;
    };
    const POLYLINE_DISTANCE = (points, px, py) => {
        let best = Infinity;
        for (let i = 1; i < points.length; i++) {
            best = Math.min(best, SEGMENT_DISTANCE(px, py, points[i - 1], points[i]));
        }
        return best;
    };
    const STITCH_TEXTURE = GL.createTexture();
    {
        const N = STITCH_FIELD.size;
        const LEFT = CURVE_POLYLINE(STITCH_CURVES.left),
            RIGHT = CURVE_POLYLINE(STITCH_CURVES.right),
            UNDER = CURVE_POLYLINE(STITCH_CURVES.under);
        const DATA = new Uint8Array(N * N * 4);
        const PACK = (distance) => Math.round(Math.min(1, distance / STITCH_FIELD.maxDistance) * 255);
        for (let j = 0; j < N; j++) {
            for (let i = 0; i < N; i++) {
                const QX = -STITCH_FIELD.extent + ((i + 0.5) / N) * STITCH_FIELD.extent * 2,
                    QY = -STITCH_FIELD.extent + ((j + 0.5) / N) * STITCH_FIELD.extent * 2;
                const AT = (j * N + i) * 4;
                DATA[AT] = PACK(Math.min(POLYLINE_DISTANCE(LEFT, QX, QY), POLYLINE_DISTANCE(RIGHT, QX, QY)));
                DATA[AT + 1] = PACK(POLYLINE_DISTANCE(UNDER, QX, QY));
                DATA[AT + 2] = PACK(
                    Math.min(
                        SEGMENT_DISTANCE(QX, QY, STITCH_TWISTS[0][0], STITCH_TWISTS[0][1]),
                        SEGMENT_DISTANCE(QX, QY, STITCH_TWISTS[1][0], STITCH_TWISTS[1][1]),
                    ),
                );
                DATA[AT + 3] = 255;
            }
        }
        GL.activeTexture(GL.TEXTURE2);
        GL.bindTexture(GL.TEXTURE_2D, STITCH_TEXTURE);
        GL.texImage2D(GL.TEXTURE_2D, 0, GL.RGBA8, N, N, 0, GL.RGBA, GL.UNSIGNED_BYTE, DATA);
        GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_MIN_FILTER, GL.LINEAR);
        GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_MAG_FILTER, GL.LINEAR);
        GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_WRAP_S, GL.CLAMP_TO_EDGE);
        GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_WRAP_T, GL.CLAMP_TO_EDGE);
    }
    const PATCH_STITCH_FIELD = (source) => {
        // From v0.24.3 the module's fill shader already reads the field; sources built from its body only lack the
        // sampler declaration (the full shader has it in its header).
        if (!source.includes('float underDistance =')) {
            if (source.includes('sampler2D u_stitchField')) {
                return source;
            }
            return source.replace('float hashCell(', 'uniform mediump sampler2D u_stitchField;\nfloat hashCell(');
        }
        const START = source.indexOf('float underDistance =');
        const END = source.indexOf('vec3 dark = tintTo(base,-0.28)');
        if (START < 0 || END < START || !source.includes('float hashCell(')) {
            throw new Error('Yarn fill shader markers not found');
        }
        const EXTENT = STITCH_FIELD.extent.toFixed(4),
            SPAN = (STITCH_FIELD.extent * 2).toFixed(4),
            MAX_DISTANCE = STITCH_FIELD.maxDistance.toFixed(4);
        const REPLACEMENT = `vec2 cellSize = vec2(sx, sy);
  float fieldScale = ${MAX_DISTANCE} * sqrt(sx * sy);
  vec2 qBase = p / cellSize;
  vec2 grooveShift = vec2(0.0, stroke * 0.06) / cellSize;
  vec2 lightShift = vec2(stroke * 0.14, stroke * 0.13) / cellSize;
  vec4 fieldMain = texture(u_stitchField, (qBase + ${EXTENT}) / ${SPAN});
  vec4 fieldGroove = texture(u_stitchField, (qBase - grooveShift + ${EXTENT}) / ${SPAN});
  vec4 fieldLight = texture(u_stitchField, (qBase + lightShift + ${EXTENT}) / ${SPAN});
  float under = lineMask(fieldGroove.g * fieldScale, stroke*0.5) * 0.5;
  float groove = lineMask(fieldGroove.r * fieldScale, stroke*1.08) * 0.85;
  float yarn = lineMask(fieldMain.r * fieldScale, stroke*0.89);
  float light = lineMask(fieldLight.r * fieldScale, stroke*0.34) * 0.57;
  float twist = 0.0;
  if (mod(index.x + index.y, 2.0) < 1.0) {
    twist = lineMask(fieldMain.b * fieldScale, stroke*0.075) * 0.5;
  }
  `;
        return (
            source
                .slice(0, START)
                .replace('float hashCell(', 'uniform mediump sampler2D u_stitchField;\nfloat hashCell(') +
            REPLACEMENT +
            source.slice(END)
        );
    };
    const CURRENT_YARN_PROGRAM_SDF = MAKE_PROGRAM(YARN_VS, PATCH_STITCH_FIELD(YARN_FS), [
        'a_position',
        'a_color',
        'a_surface',
    ]);
    const YARN_STREAM_PROGRAM_SDF = MAKE_PROGRAM(STREAM_VS, PATCH_STITCH_FIELD(YARN_STREAM_FS), STREAM_ATTRIBUTES);
    const UBER_PROGRAM_SDF = MAKE_PROGRAM(STREAM_VS, PATCH_STITCH_FIELD(UBER_FS), STREAM_ATTRIBUTES);
    // The S and U configurations read their yarn programs from here so the distance-field variants can swap them.
    const STREAM_PROGRAMS = { yarn: YARN_STREAM_PROGRAM, uber: UBER_PROGRAM };

    // --- Vertex pulling prototype ------------------------------------------------------------------------------
    // Retained yarn vertices live once in a geometry texture. Each frame the CPU writes one table row per item (a
    // sprite quad or a yarn surface: 2x3 matrix, paint id, geometry base) and, per vertex, only a 16-bit item index
    // and a 16-bit local vertex index. The vertex shader pulls the vertex and the matrix, so nothing retained is
    // copied and the whole frame is still one draw in painter's order.
    const PULL_VS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in uint a_item;
in uint a_local;
uniform mat3 u_projection;
uniform sampler2D u_items;
uniform sampler2D u_geometry;
out highp vec2 v_uv;
out vec4 v_color;
out highp vec4 v_paint;
out highp vec4 v_radial;
out highp vec4 v_rect;
const vec4 QUAD[6] = vec4[6](
  vec4(-1.0, -1.0, 0.0, 0.0), vec4(1.0, -1.0, 1.0, 0.0), vec4(1.0, 1.0, 1.0, 1.0),
  vec4(-1.0, -1.0, 0.0, 0.0), vec4(1.0, 1.0, 1.0, 1.0), vec4(-1.0, 1.0, 0.0, 1.0)
);
void main() {
  int item = int(a_item);
  int localIndex = int(a_local);
  vec4 m = texelFetch(u_items, ivec2(0, item), 0);
  vec4 t = texelFetch(u_items, ivec2(1, item), 0);
  vec2 local;
  if (t.w < 0.0) {
    vec4 q = QUAD[localIndex];
    local = q.xy;
    v_uv = q.zw;
    v_color = vec4(1.0);
    v_paint = vec4(t.z, 0.0, 0.0, 0.0);
    v_radial = vec4(0.0);
  } else {
    int vertex = int(t.w) + localIndex;
    ivec2 at = ivec2((vertex % 256) * 3, vertex / 256);
    vec4 g0 = texelFetch(u_geometry, at, 0);
    vec4 g1 = texelFetch(u_geometry, at + ivec2(1, 0), 0);
    vec4 g2 = texelFetch(u_geometry, at + ivec2(2, 0), 0);
    local = g0.xy;
    v_uv = g0.xy;
    v_color = vec4(g0.zw, g1.xy);
    v_paint = vec4(t.z, 0.0, texelFetch(u_items, ivec2(2, item), 0).x, 0.0);
    v_radial = vec4(g1.zw, g2.x, 0.0);
  }

                        const LAST = RUNS[RUNS.length - 1];
                        if (LAST && LAST.kind === 'S' && LAST.first + LAST.count === FIRST) {
                            LAST.count += 6;
                        } else {
                            RUNS.push({ kind: 'S', first: FIRST, count: 6 });
                        }
                    } else {
                        RUNS.push({ kind: 'Y', op: OP });
                    }
                }
                return { runs: RUNS, floats: at, state: STATE };
            })();
            UPLOAD_STREAM(STREAM);
            for (const RUN of STREAM.runs) {
                if (RUN.kind === 'S') {
                    USE_PROGRAM(SPRITE_PROGRAM);
                    SET_STREAM_STATE();
                    SET_PROJECTION(SPRITE_PROGRAM);
                    BIND_SPRITE_TEXTURE(SPRITE_PROGRAM);
                    DRAW_STREAM(RUN.first, RUN.count);
                } else {
                    if (VARIANT.parts === 'none') {
                        continue;
                    }
                    const C = scene.chars[RUN.op.char];
                    const S = C.scale,
                        COS = Math.cos(C.rotation) * S,
                        SIN = Math.sin(C.rotation) * S;
                    const OX = RUN.op.part ? 20 : 0;
                    const E = EFFECT_UNIFORMS(scene.surface, C.tint, 0);
                    if (!VARIANT.pattern) {
                        E.effect0 = [E.effect0[0], E.effect0[1], E.effect0[2], -Math.abs(E.effect0[3])];
                    }
                    if (!VARIANT.fiber) {
                        E.effect3 = [0, E.effect3[1], E.effect3[2], E.effect3[3]];
                    }
                    if (!VARIANT.curved) {
                        E.effect3 = [E.effect3[0], E.effect3[1], 0, E.effect3[3]];
                    }
                    const P =
                        scene.surface.material === 'sketch'
                            ? CURRENT_SKETCH_PROGRAM
                            : (VARIANT.program ?? CURRENT_YARN_PROGRAM);
                    USE_PROGRAM(P);
                    GL.bindVertexArray(scene.surface.vao);
                    SET_PROJECTION(P);
                    GL.uniformMatrix3fv(
                        P.uniforms.get('u_transform')?.location,
                        false,
                        Float32Array.of(COS, SIN, 0, -SIN, COS, 0, C.x + COS * OX, C.y + SIN * OX, 1),
                    );
                    GL.uniform1f(P.uniforms.get('u_depth')?.location, 0);
                    GL.uniform4fv(P.uniforms.get('u_bounds')?.location, E.bounds);
                    GL.uniform4fv(P.uniforms.get('u_effect0')?.location, E.effect0);
                    GL.uniform4fv(P.uniforms.get('u_effect1')?.location, E.effect1);
                    GL.uniform4fv(P.uniforms.get('u_effect2')?.location, E.effect2);
                    GL.uniform4fv(P.uniforms.get('u_effect3')?.location, E.effect3);
                    GL.uniform4fv(P.uniforms.get('u_tint')?.location, E.tint);
                    GL.uniform1f(P.uniforms.get('u_flash')?.location, E.flash);
                    GL.uniform1f(P.uniforms.get('u_forceColor')?.location, 0);
                    if (E.timeMs !== undefined) {
                        GL.uniform1f(P.uniforms.get('u_timeMs')?.location, E.timeMs);
                    }
                    const PLANES = P.uniforms.get('u_planes');
                    if (PLANES) {
                        GL.uniform3fv(PLANES.location, new Float32Array(PLANES.size * 3));
                    }
                    const G = scene.surface.geometry;
                    if (VARIANT.parts !== 'edge') {
                        GL.drawArrays(GL.TRIANGLES, G.fillFirst, G.fillCount);
                        STATS.draws++;
                        STATS.vertices += G.fillCount;
                    }
                    if (VARIANT.parts !== 'fill' && G.edgeCount) {
                        GL.drawArrays(GL.TRIANGLES, G.edgeFirst, G.edgeCount);
                        STATS.draws++;
                        STATS.vertices += G.edgeCount;
                    }
                }
            }
        },
        // S: yarn rides the shared stream layout but keeps its own program; runs switch programs.
        S(scene) {
            const BUILT = BUILD_STREAM(scene);
            UPLOAD_STREAM(BUILT);
            UPLOAD_SURFACE_DATA(BUILT);
            SET_STREAM_STATE();
            for (const RUN of BUILT.runs) {
                if (RUN.kind === 'S') {
                    USE_PROGRAM(SPRITE_PROGRAM);
                    SET_PROJECTION(SPRITE_PROGRAM);
                    BIND_SPRITE_TEXTURE(SPRITE_PROGRAM);
                } else {
                    const SURFACE_PROGRAM =
                        scene.surface.material === 'sketch' ? STREAM_PROGRAMS.sketch : STREAM_PROGRAMS.yarn;
                    USE_PROGRAM(SURFACE_PROGRAM);
                    SET_PROJECTION(SURFACE_PROGRAM);
                    BIND_SURFACE_DATA(SURFACE_PROGRAM);
                }
                DRAW_STREAM(RUN.first, RUN.count);
            }
        },
        // U: one program, yarn is a mode of the stream fragment shader; the whole frame is one draw.
        U(scene) {
            const BUILT = BUILD_STREAM(scene);
            UPLOAD_STREAM(BUILT);
            UPLOAD_SURFACE_DATA(BUILT);
            SET_STREAM_STATE();
            USE_PROGRAM(STREAM_PROGRAMS.uber);
            SET_PROJECTION(STREAM_PROGRAMS.uber);
            BIND_SPRITE_TEXTURE(STREAM_PROGRAMS.uber);
            BIND_SURFACE_DATA(STREAM_PROGRAMS.uber);
            DRAW_STREAM(0, BUILT.floats / VERTEX_FLOATS);
        },
    };

    // Vertex pulling: per-frame CPU work is one row per item plus two 16-bit indices per vertex.
    const PULL_STATE = new Map();
    const PULL_STATE_FOR = (scene) => {
        let state = PULL_STATE.get(scene);
        if (!state) {
            const TOTAL = scene.surface.totalVertices;
            const SPRITES = scene.ops.filter((op) => op.kind === 'S').length;
            const VERTICES = SPRITES * 6 + scene.yarnCount * TOTAL;
            state = {
                items: new Float32Array(scene.ops.length * 12),
                itemRefs: new Uint16Array(VERTICES),
                localRefs: new Uint16Array(VERTICES),
                localTemplate: Uint16Array.from({ length: TOTAL }, (_, i) => i),
                surfaceData: new Float32Array(scene.yarnCount * SURFACE_TEXELS * 4),
                vertices: VERTICES,
            };
            PULL_STATE.set(scene, state);
        }
        return state;
    };
    let pullCapacity = 0;
    const PULL_FRAME = (scene, program) => {
        const STATE = PULL_STATE_FOR(scene);
        const { items: ITEMS, itemRefs: ITEM_REFS, localRefs: LOCAL_REFS } = STATE;
        const TOTAL = scene.surface.totalVertices;
        let at = 0,
            row = 0;
        scene.ops.forEach((op, i) => {
            const C = scene.chars[op.char];
            const OX = op.part ? 20 : 0;
            const COS0 = Math.cos(C.rotation),
                SIN0 = Math.sin(C.rotation);
            const I = i * 12;
            if (op.kind === 'S') {
                const HALF = scene.spriteSize * 0.5 * C.scale;
                ITEMS[I] = COS0 * HALF;
                ITEMS[I + 1] = SIN0 * HALF;
                ITEMS[I + 2] = -SIN0 * HALF;
                ITEMS[I + 3] = COS0 * HALF;
                ITEMS[I + 4] = C.x + COS0 * OX;
                ITEMS[I + 5] = C.y + SIN0 * OX;
                ITEMS[I + 6] = C.layer;
                ITEMS[I + 7] = -1;
                ITEMS[I + 8] = 0;
                for (let k = 0; k < 6; k++) {
                    ITEM_REFS[at + k] = i;
                    LOCAL_REFS[at + k] = k;
                }
                at += 6;
            } else {
                const COS = COS0 * C.scale,
                    SIN = SIN0 * C.scale;
                ITEMS[I] = COS;
                ITEMS[I + 1] = SIN;
                ITEMS[I + 2] = -SIN;
                ITEMS[I + 3] = COS;
                ITEMS[I + 4] = C.x + COS * OX;
                ITEMS[I + 5] = C.y + SIN * OX;
                ITEMS[I + 6] = row;
                ITEMS[I + 7] = scene.surface.gBase;
                ITEMS[I + 8] = scene.surface.mode;
                ITEM_REFS.fill(i, at, at + TOTAL);
                LOCAL_REFS.set(STATE.localTemplate, at);
                at += TOTAL;
                WRITE_SURFACE_ROW(STATE.surfaceData, row, scene, op);
                row++;
            }
        });
        GL.bindVertexArray(PULL_VAO);
        const BYTES = at * 2;
        if (pullCapacity < BYTES) {
            pullCapacity = BYTES;
            for (const BUFFER of [PULL_ITEM_BUFFER, PULL_LOCAL_BUFFER]) {
                GL.bindBuffer(GL.ARRAY_BUFFER, BUFFER);
                GL.bufferData(GL.ARRAY_BUFFER, BYTES, GL.STREAM_DRAW);
            }
        }
        GL.bindBuffer(GL.ARRAY_BUFFER, PULL_ITEM_BUFFER);
        GL.bufferSubData(GL.ARRAY_BUFFER, 0, ITEM_REFS, 0, at);
        GL.bindBuffer(GL.ARRAY_BUFFER, PULL_LOCAL_BUFFER);
        GL.bufferSubData(GL.ARRAY_BUFFER, 0, LOCAL_REFS, 0, at);
        GL.activeTexture(GL.TEXTURE3);
        GL.bindTexture(GL.TEXTURE_2D, ITEM_TEXTURE);
        GL.texSubImage2D(GL.TEXTURE_2D, 0, 0, 0, 3, scene.ops.length, GL.RGBA, GL.FLOAT, ITEMS);
        STATS.uploadBytes += BYTES * 2 + scene.ops.length * 48;
        UPLOAD_SURFACE_DATA({ rows: row, state: STATE });
        USE_PROGRAM(program);
        SET_PROJECTION(program);
        BIND_SPRITE_TEXTURE(program);
        BIND_SURFACE_DATA(program);
        GL.activeTexture(GL.TEXTURE3);
        GL.bindTexture(GL.TEXTURE_2D, ITEM_TEXTURE);
        GL.uniform1i(program.uniforms.get('u_items').location, 3);
        GL.activeTexture(GL.TEXTURE4);
        GL.bindTexture(GL.TEXTURE_2D, GEOMETRY_TEXTURE.texture);
        GL.uniform1i(program.uniforms.get('u_geometry').location, 4);
        DRAW_STREAM(0, at);
    };
    CONFIGS.UP = (scene) => PULL_FRAME(scene, PULL_PROGRAM);
    CONFIGS.UP_SDF = (scene) => PULL_FRAME(scene, PULL_PROGRAM_SDF);
    // The combined program carries yarn (distance field) and sketch; BOTH draws either material.
    CONFIGS.U_BOTH = (scene) => {
        STREAM_PROGRAMS.uber = UBER_PROGRAM_BOTH;
        try {
            CONFIGS.U(scene);
        } finally {
            STREAM_PROGRAMS.uber = UBER_PROGRAM;
        }
    };
    CONFIGS.UP_BOTH = (scene) => PULL_FRAME(scene, PULL_PROGRAM_BOTH);
    // Each variant swaps in the distance-field yarn programs for the duration of one frame.
    const WITH_STITCH_FIELD = (config) => (scene) => {
        STREAM_PROGRAMS.yarn = YARN_STREAM_PROGRAM_SDF;
        STREAM_PROGRAMS.uber = UBER_PROGRAM_SDF;
        VARIANT.program = CURRENT_YARN_PROGRAM_SDF;
        try {
            CONFIGS[config](scene);
        } finally {
            STREAM_PROGRAMS.yarn = YARN_STREAM_PROGRAM;
            STREAM_PROGRAMS.uber = UBER_PROGRAM;
            VARIANT.program = null;
        }
    };
    CONFIGS.current_SDF = WITH_STITCH_FIELD('current');
    CONFIGS.S_SDF = WITH_STITCH_FIELD('S');
    CONFIGS.U_SDF = WITH_STITCH_FIELD('U');
    // Reference for the size of the stitch signal itself: the same frame with the stitch pattern switched off.
    CONFIGS.current_flat = (scene) => {
        VARIANT.pattern = false;
        try {
            CONFIGS.current(scene);
        } finally {
            VARIANT.pattern = true;
        }
    };
    const BEGIN_FRAME = () => {
        GL.viewport(0, 0, WIDTH, HEIGHT);
        GL.disable(GL.DEPTH_TEST);
        GL.disable(GL.STENCIL_TEST);
        GL.enable(GL.BLEND);
        GL.blendFunc(GL.ONE, GL.ONE_MINUS_SRC_ALPHA);
        GL.clearColor(0.06, 0.08, 0.12, 1);
        GL.clear(GL.COLOR_BUFFER_BIT);
        currentProgram = null;
    };
    const MEDIAN = (values) => {
        const SORTED = values.slice().sort((a, b) => a - b);
        return SORTED[Math.floor(SORTED.length / 2)];
    };
    const MEASURE = async (config, scene, { frames, warmup }) => {
        for (let i = 0; i < warmup; i++) {
            BEGIN_FRAME();
            CONFIGS[config](scene);
            GL.finish();
        }
        const CPU = [],
            GPU = [],
            QUERIES = [];
        STATS.draws = STATS.programSwitches = STATS.uploadBytes = STATS.vertices = 0;
        const WALL_START = performance.now();
        for (let i = 0; i < frames; i++) {
            BEGIN_FRAME();
            const QUERY = TIMER ? GL.createQuery() : null;
            if (QUERY) {
                GL.beginQuery(TIMER.TIME_ELAPSED_EXT, QUERY);
            }
            const T0 = performance.now();
            CONFIGS[config](scene);
            CPU.push(performance.now() - T0);
            if (QUERY) {
                GL.endQuery(TIMER.TIME_ELAPSED_EXT);
                QUERIES.push(QUERY);
            }
            GL.finish();
        }
        const WALL = (performance.now() - WALL_START) / frames;
        let gpuStatus = 'unsupported';
        if (TIMER) {
            gpuStatus = 'measured';
            const DISJOINT = GL.getParameter(TIMER.GPU_DISJOINT_EXT);
            for (const QUERY of QUERIES) {
                while (!GL.getQueryParameter(QUERY, GL.QUERY_RESULT_AVAILABLE)) {
                    await new Promise((done) => setTimeout(done, 1));
                }
                GPU.push(GL.getQueryParameter(QUERY, GL.QUERY_RESULT) / 1e6);
                GL.deleteQuery(QUERY);
            }
            if (DISJOINT) {
                gpuStatus = 'disjoint';
            }
        }
        return {
            cpuMs: MEDIAN(CPU),
            gpuMs: GPU.length ? MEDIAN(GPU) : null,
            gpuStatus,
            wallMs: WALL,
            draws: STATS.draws / frames,
            programSwitches: STATS.programSwitches / frames,
            uploadKB: STATS.uploadBytes / frames / 1024,
            vertices: STATS.vertices / frames,
        };
    };
    const READ_FRAME = () => {
        const PIXELS = new Uint8Array(WIDTH * HEIGHT * 4);
        GL.readPixels(0, 0, WIDTH, HEIGHT, GL.RGBA, GL.UNSIGNED_BYTE, PIXELS);
        return PIXELS;
    };
    const VERIFY = (scene) => {
        const IMAGES = {};
        for (const CONFIG of Object.keys(CONFIGS)) {
            BEGIN_FRAME();
            CONFIGS[CONFIG](scene);
            GL.finish();
            IMAGES[CONFIG] = READ_FRAME();
        }
        const COMPARE = (a, b) => {
            let sum = 0,
                max = 0,
                over = 0;
            for (let i = 0; i < a.length; i += 4) {
                for (let c = 0; c < 3; c++) {
                    const D = Math.abs(a[i + c] - b[i + c]);
                    sum += D;
                    max = Math.max(max, D);
                    if (D > 8) {
                        over++;
                    }
                }
            }
            return { meanAbs: sum / (a.length * 0.75), maxAbs: max, channelsOver8: over };
        };
        return { 'S vs current': COMPARE(IMAGES.S, IMAGES.current), 'U vs current': COMPARE(IMAGES.U, IMAGES.current) };
    };

    window.yarnStreamBenchmark = {
        ready: true,
        renderer: RENDERER,
        timerQuery: Boolean(TIMER),
        // Pixel difference between two configurations, measured over the pixels either image changed from the clear color.
        compare({ scene, a, b }) {
            const SCENE = BUILD_SCENE(scene);
            const RENDER = (config) => {
                BEGIN_FRAME();
                CONFIGS[config](SCENE);
                GL.finish();
                return READ_FRAME();
            };
            const IMAGE_A = RENDER(a),
                IMAGE_B = RENDER(b);
            const CLEAR = [15, 20, 31];
            let active = 0,
                sum = 0,
                max = 0,
                over8 = 0,
                over32 = 0;
            for (let i = 0; i < IMAGE_A.length; i += 4) {
                let touched = false,
                    worst = 0;
                for (let c = 0; c < 3; c++) {
                    if (Math.abs(IMAGE_A[i + c] - CLEAR[c]) > 2 || Math.abs(IMAGE_B[i + c] - CLEAR[c]) > 2) {
                        touched = true;
                    }
                    const D = Math.abs(IMAGE_A[i + c] - IMAGE_B[i + c]);
                    sum += D;
                    worst = Math.max(worst, D);
                }
                if (touched) {
                    active++;
                    max = Math.max(max, worst);
                    over8 += worst > 8 ? 1 : 0;
                    over32 += worst > 32 ? 1 : 0;
                }
            }
            return {
                activePixels: active,
                meanAbsPerChannel: sum / Math.max(1, active * 3),
                maxAbs: max,
                fractionOver8: over8 / Math.max(1, active),
                fractionOver32: over32 / Math.max(1, active),
            };
        },
        // Renders one frame of a scene with the chosen configuration and returns the canvas as a PNG data URL.
        snapshot({ scene, config = 'current' }) {
            const SCENE = BUILD_SCENE(scene);
            BEGIN_FRAME();
            CONFIGS[config](SCENE);
            GL.finish();
            return { url: CANVAS.toDataURL('image/png'), chars: SCENE.chars };
        },
        // GPU cost of each yarn stage in the current (per-surface) configuration, relative to a frame without yarn.
        async decompose({ scenes, frames = 60, warmup = 20, repeats = 3 }) {
            const DEFINITIONS = [
                { name: 'none', parts: 'none' },
                { name: 'full' },
                { name: 'fillOnly', parts: 'fill' },
                { name: 'edgeOnly', parts: 'edge' },
                { name: 'fillFlat', parts: 'fill', pattern: false },
                { name: 'noPattern', pattern: false },
                { name: 'noFiber', fiber: false },
                { name: 'noCurve', curved: false },
                { name: 'noUnder', fs: 'noUnder' },
                { name: 'noGroove', fs: 'noGroove' },
                { name: 'noLight', fs: 'noLight' },
                { name: 'noTwist', fs: 'noTwist' },
            ];
            const OUTPUT = { renderer: RENDERER, frames, repeats, scenes: [] };
            for (const DEFINITION of scenes) {
                const SCENE = BUILD_SCENE(DEFINITION);
                const SAMPLES = Object.fromEntries(DEFINITIONS.map((variant) => [variant.name, []]));
                for (let r = 0; r < repeats; r++) {
                    const ORDER = DEFINITIONS.slice();
                    for (let k = 0; k < r % ORDER.length; k++) {
                        ORDER.push(ORDER.shift());
                    }
                    for (const VARIANT_DEFINITION of ORDER) {
                        Object.assign(VARIANT, {
                            program: VARIANT_DEFINITION.fs ? VARIANT_PROGRAM(VARIANT_DEFINITION.fs) : null,
                            parts: VARIANT_DEFINITION.parts ?? 'both',
                            pattern: VARIANT_DEFINITION.pattern ?? true,
                            fiber: VARIANT_DEFINITION.fiber ?? true,
                            curved: VARIANT_DEFINITION.curved ?? true,
                        });
                        SAMPLES[VARIANT_DEFINITION.name].push(await MEASURE('current', SCENE, { frames, warmup }));
                    }
                }
                Object.assign(VARIANT, { program: null, parts: 'both', pattern: true, fiber: true, curved: true });
                const ENTRY = { definition: DEFINITION, yarnSurfaces: SCENE.yarnCount, variants: {} };
                for (const VARIANT_DEFINITION of DEFINITIONS) {
                    ENTRY.variants[VARIANT_DEFINITION.name] = {
                        gpuMs: MEDIAN(SAMPLES[VARIANT_DEFINITION.name].map((sample) => sample.gpuMs)),
                        cpuMs: MEDIAN(SAMPLES[VARIANT_DEFINITION.name].map((sample) => sample.cpuMs)),
                    };
                }
                OUTPUT.scenes.push(ENTRY);
            }
            return OUTPUT;
        },
        async run({
            scenes,
            configs = ['current', 'S', 'U'],
            frames = 120,
            warmup = 30,
            repeats = 3,
            doVerify = true,
        }) {
            const OUTPUT = {
                renderer: RENDERER,
                timerQuery: Boolean(TIMER),
                width: WIDTH,
                height: HEIGHT,
                frames,
                repeats,
                scenes: [],
            };
            for (const DEFINITION of scenes) {
                const SCENE = BUILD_SCENE(DEFINITION);
                const ENTRY = {
                    definition: DEFINITION,
                    runs: SCENE.runs,
                    yarnSurfaces: SCENE.yarnCount,
                    vertsPerSurface: SCENE.surface.totalVertices,
                    results: {},
                };
                if (doVerify && SCENE.yarnCount && SCENE.n <= 64) {
                    ENTRY.verify = VERIFY(SCENE);
                }
                const SAMPLES = Object.fromEntries(configs.map((c) => [c, []]));
                for (let r = 0; r < repeats; r++) {
                    const ORDER = configs.slice();
                    for (let k = 0; k < r % ORDER.length; k++) {
                        ORDER.push(ORDER.shift());
                    }
                    for (const CONFIG of ORDER) {
                        SAMPLES[CONFIG].push(await MEASURE(CONFIG, SCENE, { frames, warmup }));
                    }
                }
                for (const CONFIG of configs) {
                    const LIST = SAMPLES[CONFIG];
                    ENTRY.results[CONFIG] = {
                        cpuMs: MEDIAN(LIST.map((s) => s.cpuMs)),
                        gpuMs: LIST[0].gpuMs === null ? null : MEDIAN(LIST.map((s) => s.gpuMs)),
                        gpuStatus: LIST[0].gpuStatus,
                        wallMs: MEDIAN(LIST.map((s) => s.wallMs)),
                        draws: LIST[0].draws,
                        programSwitches: LIST[0].programSwitches,
                        uploadKB: LIST[0].uploadKB,
                        vertices: LIST[0].vertices,
                    };
                }
                OUTPUT.scenes.push(ENTRY);
            }
            return OUTPUT;
        },
    };
