<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameKit texture array</title>
<style>
    body {
        margin: 0;
        background: #101923;
        color: #dce8f1;
        font:
            15px system-ui,
            sans-serif;
    }
    main {
        max-width: 960px;
        margin: 0 auto;
        padding: 10px 14px 24px;
    }
    h1 {
        margin: 4px 0 6px;
        font-size: 20px;
    }
    p,
    li {
        color: #a9bdcb;
        line-height: 1.5;
    }
    p {
        margin: 6px 0;
    }
    ul {
        margin: 6px 0;
        padding-left: 20px;
    }
    .controls {
        display: flex;
        gap: 10px;
        margin: 10px 0;
    }
    button {
        flex: 1;
        min-height: 56px;
        border: 1px solid #526374;
        border-radius: 12px;
        background: #1b2a38;
        color: #dce8f1;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
    }
    button[aria-pressed='true'] {
        border-color: #8fd0ea;
        background: #2f6f8f;
    }
    canvas {
        display: block;
        width: min(100%, calc((100vh - 240px) * 1.8));
        min-width: 240px;
        height: auto;
        margin: 0 auto;
        border: 1px solid #526374;
        border-radius: 12px;
    }
</style>
<main>
    <h1>공유 아틀라스로 그리기</h1>
    <p>
        스프라이트 시트가 여러 장이어도 모두 한 텍스처 어레이의 영역이라서, 도형을 사이사이에 끼워도 한 번에 그립니다.
    </p>
    <div class="controls">
        <button id="mode-sprites" type="button" aria-pressed="true">스프라이트만</button>
        <button id="mode-mixed" type="button" aria-pressed="false">도형 끼워 그리기</button>
    </div>
    <canvas id="scene" width="720" height="400"></canvas>
    <p id="stats" aria-live="polite"></p>
    <ul>
        <li>시트 4장은 장치가 가진 어레이 하나의 영역 4개이며, 스프라이트는 시트를 번갈아 가며 그립니다.</li>
        <li>두 번째 방식은 스프라이트마다 앞에 사각형을 그려도 같은 그리기 호출에 들어갑니다.</li>
        <li>블렌드나 클리핑 방식이 바뀌면 그리기 호출이 나뉩니다.</li>
    </ul>
</main>
<script type="module">
    import { WebGLDevice, VectorContext, createSpriteAnimation } from '/dist/rendering.js';
    const CANVAS = document.querySelector('#scene');
    const WIDTH = CANVAS.width;
    const HEIGHT = CANVAS.height;
    const PAGE_COUNT = 4;
    const CELL = 32;
    const PAGE_SIZE = CELL * 2;
    const SPRITE_COUNT = 240;
    const DEVICE = new WebGLDevice(CANVAS, {
        alpha: false,
        antialias: false,
        preserveDrawingBuffer: true,
    });
    const CONTEXT = new VectorContext(DEVICE);
    // Page p is a 2x2 sheet of four shapes in one hue; the hue identifies the page on screen.
    const DRAW_PAGE = (page) => {
        const SHEET = document.createElement('canvas');
        SHEET.width = SHEET.height = PAGE_SIZE;
        const CANVAS_2D = SHEET.getContext('2d');
        for (let cell = 0; cell < 4; cell++) {
            const X = (cell % 2) * CELL + CELL / 2;
            const Y = Math.floor(cell / 2) * CELL + CELL / 2;
            const R = CELL * 0.42;
            CANVAS_2D.fillStyle = `hsl(${page * 90 + 20}, 80%, ${45 + cell * 6}%)`;
            CANVAS_2D.beginPath();
            if (cell === 0) {
                CANVAS_2D.arc(X, Y, R, 0, Math.PI * 2);
            } else if (cell === 1) {
                CANVAS_2D.rect(X - R, Y - R, R * 2, R * 2);
            } else if (cell === 2) {
                CANVAS_2D.moveTo(X, Y - R);
                CANVAS_2D.lineTo(X + R, Y + R);
                CANVAS_2D.lineTo(X - R, Y + R);
                CANVAS_2D.closePath();
            } else {
                CANVAS_2D.moveTo(X, Y - R);
                CANVAS_2D.lineTo(X + R, Y);
                CANVAS_2D.lineTo(X, Y + R);
                CANVAS_2D.lineTo(X - R, Y);
                CANVAS_2D.closePath();
            }
            CANVAS_2D.fill();
        }
        return SHEET;
    };
    const CELL_RECT = (cell) => ({ x: (cell % 2) * CELL, y: Math.floor(cell / 2) * CELL, width: CELL, height: CELL });
    // One atlas region per sheet; the device array holds all four.
    const REGIONS = Array.from({ length: PAGE_COUNT }, (_unused, page) => {
        const REGION = DEVICE.textureAtlas.allocate(PAGE_SIZE, PAGE_SIZE, { filter: 'nearest' });
        DEVICE.textureAtlas.upload(REGION, DRAW_PAGE(page));
        return REGION;
    });
    const SPRITES = REGIONS.map((region) =>
        createSpriteAnimation(CONTEXT, region, {
            frames: [0, 1, 2, 3].map((cell) => ({ ...CELL_RECT(cell), durationMs: 100 })),
            clips: Object.fromEntries([0, 1, 2, 3].map((cell) => [`c${cell}`, { frames: [cell] }])),
        }),
    );
    const PLAYERS = Array.from({ length: PAGE_COUNT * 4 }, (_unused, index) =>
        SPRITES[Math.floor(index / 4)].createPlayer({ clip: `c${index % 4}` }),
    );
    // Deterministic placement; sprite i uses page i % 4, so consecutive sprites never share a page.
    let seed = 12345;
    const RANDOM = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
    };
    const PLACEMENTS = Array.from({ length: SPRITE_COUNT }, (_unused, index) => ({
        frame: (index % PAGE_COUNT) * 4 + (Math.floor(index / PAGE_COUNT) % 4),
        x: Math.floor(RANDOM() * (WIDTH - CELL)),
        y: Math.floor(RANDOM() * (HEIGHT - CELL)),
    }));
    const BUTTONS = {
        sprites: document.querySelector('#mode-sprites'),
        mixed: document.querySelector('#mode-mixed'),
    };
    const EXAMPLE = {
        device: DEVICE,
        mode: 'sprites',
        drawCalls: 0,
        spriteCount: SPRITE_COUNT,
        setMode(mode) {
            if (mode !== 'sprites' && mode !== 'mixed') {
                throw new TypeError('mode must be sprites or mixed');
            }
            EXAMPLE.mode = mode;
            CONTEXT.beginFrame({ width: WIDTH, height: HEIGHT, clearColor: [0.06, 0.1, 0.14, 1] });
            for (const PLACEMENT of PLACEMENTS) {
                if (mode === 'mixed') {
                    CONTEXT.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    CONTEXT.fillRect(PLACEMENT.x - 2, PLACEMENT.y - 2, CELL + 4, CELL + 4);
                }
                PLAYERS[PLACEMENT.frame].draw({
                    timeMs: 0,
                    matrix: [1, 0, 0, 1, PLACEMENT.x, PLACEMENT.y],
                });
            }
            EXAMPLE.drawCalls = CONTEXT.endFrame().drawCalls;
            for (const [NAME, BUTTON] of Object.entries(BUTTONS)) {
                BUTTON.setAttribute('aria-pressed', String(NAME === mode));
            }
            document.querySelector('#stats').textContent =
                `그리기 호출 ${EXAMPLE.drawCalls}회 · 스프라이트 ${SPRITE_COUNT}개` +
                (mode === 'mixed' ? ` · 사각형 ${SPRITE_COUNT}개 끼워 그림` : '');
            return EXAMPLE.drawCalls;
        },
        readPixels() {
            const GL = DEVICE.gl;
            const PIXELS = new Uint8Array(WIDTH * HEIGHT * 4);
            GL.readPixels(0, 0, WIDTH, HEIGHT, GL.RGBA, GL.UNSIGNED_BYTE, PIXELS);
            return PIXELS;
        },
    };
    BUTTONS.sprites.addEventListener('click', () => EXAMPLE.setMode('sprites'));
    BUTTONS.mixed.addEventListener('click', () => EXAMPLE.setMode('mixed'));
    EXAMPLE.setMode('sprites');
    window.textureArrayExample = EXAMPLE;
    window.addEventListener(
        'pagehide',
        () => {
            SPRITES.forEach((sprites) => sprites.dispose());
            CONTEXT.dispose();
            DEVICE.dispose();
        },
        { once: true },
    );
</script>
