<!doctype html>
<html lang="ko">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>광고 어댑터 실제 확인 · bloom-gamekit</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font:
                16px system-ui,
                sans-serif;
            max-width: 720px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            background: #111c24;
            color: #e6f1f3;
            line-height: 1.55;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 0.5rem;
        }
        ul {
            padding-left: 1.2rem;
            color: #aebfc6;
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin: 1rem 0 0.4rem;
        }
        input,
        select,
        button {
            width: 100%;
            min-height: 56px;
            font: inherit;
            border-radius: 10px;
            border: 1px solid #40535e;
            background: #1b2c37;
            color: inherit;
            padding: 0 0.8rem;
        }
        button {
            margin-top: 0.6rem;
            background: #2b6f86;
            border-color: #3f8fa8;
            font-weight: 600;
        }
        button:disabled {
            opacity: 0.45;
        }
        .notice {
            margin: 0.6rem 0 0;
            color: #f0c674;
            min-height: 1.5em;
        }
        pre {
            padding: 1rem;
            background: #091117;
            border: 1px solid #40535e;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 0.85rem;
        }
    </style>
    <h1>광고 어댑터 실제 확인</h1>
    <p>광고 소스를 고르고 연결하면 실제 테스트 광고로 bm 어댑터를 확인합니다. 보상은 rewarded일 때만 올라갑니다.</p>
    <ul>
        <li>IMA 샘플 영상은 승인이 필요 없습니다. Google의 공개 샘플 태그로 테스트용 영상이 나옵니다.</li>
        <li>Google H5는 게시자 ID와 승인된 AdSense 계정, H5 베타, 승인된 사이트의 도메인이 필요합니다.</li>
        <li>광고가 없거나 광고 차단이 켜져 있으면 결과는 unavailable입니다.</li>
    </ul>
    <label for="source">광고 소스</label>
    <select id="source">
        <option value="ima-linear">IMA 샘플 영상 (승인 불필요)</option>
        <option value="ima-skippable">IMA 샘플 영상 · 건너뛸 수 있음</option>
        <option value="ima-error">IMA 샘플 · 광고 없음(오류 태그)</option>
        <option value="google">Google H5 Games Ads (게시자 ID)</option>
    </select>
    <div id="publisher-field" hidden>
        <label for="publisher">게시자 ID</label>
        <input id="publisher" inputmode="text" autocomplete="off" placeholder="ca-pub-1234567890123456" />
    </div>
    <button id="connect">연결</button>
    <p class="notice" id="notice"></p>
    <button id="rewarded" disabled>광고 보고 보상 받기</button>
    <button id="interstitial" disabled>전면 광고 (다음 단계로)</button>
    <pre id="output"></pre>
    <pre id="log"></pre>
    <script type="module">
        import { createBm } from '../../../dist/bm.js';
        import { createGoogleAdsAdapter } from '../../../dist/bm-google-ads.js';
        import { createImaAdapter, IMA_SAMPLE_TAGS } from '../../../dist/bm-ima.js';

        const LOG = [],
            NOTICE = document.querySelector('#notice'),
            INPUT = document.querySelector('#publisher'),
            SOURCE = document.querySelector('#source'),
            BUTTONS = [document.querySelector('#rewarded'), document.querySelector('#interstitial')];
        let bm = null,
            sdkReady = null,
            rewards = 0,
            last = null;

        function log(line) {
            LOG.unshift(line);
            LOG.length = Math.min(LOG.length, 10);
            document.querySelector('#log').textContent = LOG.join('\n');
        }

        function render() {
            const REWARDED = bm?.canShow('rewarded'),
                INTERSTITIAL = bm?.canShow('interstitial'),
                SUMMARY = (gate) => (!gate ? '-' : gate.ok ? 'ok' : gate.reason);
            document.querySelector('#output').textContent = JSON.stringify(
                {
                    connected: bm !== null,
                    sdkReady,
                    rewards,
                    shown: bm?.stats.shown ?? null,
                    canShow: { rewarded: SUMMARY(REWARDED), interstitial: SUMMARY(INTERSTITIAL) },
                    last,
                },
                null,
                2,
            );
        }

        function createAdapter() {
            if (SOURCE.value === 'google') {
                const CLIENT_ID = INPUT.value.trim();
                if (!/^ca-pub-\d+$/.test(CLIENT_ID)) {
                    NOTICE.textContent = "게시자 ID는 'ca-pub-' 뒤에 숫자가 붙은 형태입니다.";
                    return null;
                }
                return createGoogleAdsAdapter({ clientId: CLIENT_ID, testMode: true });
            }
            return createImaAdapter({
                adTagUrl:
                    { 'ima-skippable': IMA_SAMPLE_TAGS.skippable, 'ima-error': IMA_SAMPLE_TAGS.redirectError }[
                        SOURCE.value
                    ] ?? IMA_SAMPLE_TAGS.linear,
            });
        }

        async function connect() {
            NOTICE.textContent = '';
            const ADAPTER = createAdapter();
            if (!ADAPTER) {
                return;
            }
            bm?.dispose();
            // 어댑터 확인이 목적이라 bm의 쿨다운이 결과를 가리지 않게 합니다. Google 쪽 빈도 제한은 그대로 적용됩니다.
            bm = createBm({ adapter: ADAPTER, policy: { interstitialCooldownMs: 0 } });
            bm.on('adstart', ({ type, placement }) => log(`adstart ${type}/${placement}`));
            bm.on('adend', ({ status, reason }) => log(`adend ${status}${reason ? ' (' + reason + ')' : ''}`));
            sdkReady = await bm.preload('entry');
            if (!sdkReady) {
                NOTICE.textContent =
                    'SDK가 준비되지 않았습니다. 승인된 도메인인지, 광고 차단이 꺼져 있는지 확인하세요.';
            }
            for (const BUTTON of BUTTONS) {
                BUTTON.disabled = false;
            }
            render();
        }

        async function run(type) {
            const RESULT = await (type === 'rewarded' ? bm.showRewarded('entry') : bm.showInterstitial('next'));
            if (RESULT.status === 'rewarded') {
                rewards++;
            }
            last = { type: RESULT.type, status: RESULT.status, reason: RESULT.reason ?? null };
            render();
        }

        SOURCE.addEventListener('change', () => {
            document.querySelector('#publisher-field').hidden = SOURCE.value !== 'google';
        });
        document.querySelector('#connect').addEventListener('click', connect);
        BUTTONS[0].addEventListener('click', () => run('rewarded'));
        BUTTONS[1].addEventListener('click', () => run('interstitial'));
        // 같은 상태로 다시 열 수 있게 주소로 정합니다. 예: #source=ima-error&connect=1 (htmlpreview는 ? 뒤를 쓰므로 # 형식을 권장)
        // source: ima-linear | ima-skippable | ima-error | google, client: ca-pub-..., connect=1: 열자마자 연결
        const PARAMS = new URLSearchParams(location.search.slice(1) + '&' + location.hash.slice(1));
        if ([...SOURCE.options].some((option) => option.value === PARAMS.get('source'))) {
            SOURCE.value = PARAMS.get('source');
        }
        if (/^ca-pub-\d+$/.test(PARAMS.get('client') ?? '')) {
            INPUT.value = PARAMS.get('client');
        }
        document.querySelector('#publisher-field').hidden = SOURCE.value !== 'google';
        setInterval(render, 500);
        render();
        window.bmExample = { connect };
        if (PARAMS.get('connect') === '1') {
            connect();
        }
    </script>
</html>
