<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rollback netcode · real WebRTC check</title>
    <style>
        :root {
            color-scheme: dark;
            font:
                16px/1.5 system-ui,
                sans-serif;
            background: #101723;
            color: #eef4ff;
        }
        body {
            margin: 0 auto;
            max-width: 1050px;
            padding: 38px 30px;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 30px;
        }
        p {
            color: #a8b8cf;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 28px 0;
        }
        .card {
            padding: 20px;
            background: #1a2638;
            border: 1px solid #354660;
            border-radius: 10px;
        }
        .card small {
            display: block;
            color: #a8b8cf;
        }
        .card strong {
            font-size: 27px;
        }
        #status {
            padding: 12px 16px;
            background: #21344b;
            border-radius: 8px;
        }
        #status.pass {
            background: #193d31;
            color: #c5f8df;
        }
        #status.fail {
            background: #4c2330;
            color: #ffccd6;
        }
        pre {
            background: #111e2e;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
    <h1>Rollback netcode · real WebRTC check</h1>
    <p>
        Two browser pages exchange binary packets over real RTCPeerConnections. The simulation is compared with an
        offline integer oracle.
    </p>
    <div id="status">Waiting for the browser verification script.</div>
    <div class="cards">
        <div class="card"><small>Local player</small><strong id="player">—</strong></div>
        <div class="card"><small>Simulation tick</small><strong id="tick">0</strong></div>
        <div class="card"><small>State hash</small><strong id="hash">—</strong></div>
    </div>
    <pre id="details">No connection yet.</pre>
    <script type="module">
        import { createSession, profiles, VERSION } from '../../../dist/rollback.js';
        import { playReplay } from '../../../dist/replay.js';
        import { WebRTCTransport } from '../../../dist/transport.js';
        const IDS = ['a', 'b'];
        const STATE = new Int32Array(8);
        const EXECUTED_COMMANDS = [];
        const TICK_RATES = new Set();
        let peer;
        let inputChannel;
        let controlChannel;
        let session;
        let localPlayerId;
        let cleanup;
        let mode = 'rollback';
        const SIMULATION_COST = {
            saves: 0,
            steps: 0,
            predicted: 0,
            resimulated: 0,
        };
        const EVENTS = [];
        const ERRORS = [];
        const CANDIDATES = [];
        function input(player, tick) {
            return new Uint8Array([((tick * (player === 'a' ? 7 : 11) + (tick >> 2)) % 15) + 1]);
        }
        function simulate(targetState, { tick, tickRate, inputs }) {
            if (tickRate !== 60 || targetState[4] !== tick) {
                throw new Error('Simulation tick/rate contract violated');
            }
            for (let index = 0; index < inputs.length; index++) {
                const FRAME = inputs[index];
                if (FRAME.playerId !== IDS[index]) {
                    throw new Error('Player order changed');
                }
                const VALUE = FRAME.input[0];
                targetState[index] += (VALUE & 1 ? 2 : 0) - (VALUE & 2 ? 1 : 0);
                targetState[index + 2] += (VALUE & 4 ? 3 : 0) - (VALUE & 8 ? 2 : 0);
                for (const COMMAND of FRAME.commands) {
                    if (COMMAND.executeTick !== tick) {
                        throw new Error('Command executed at wrong tick');
                    }
                    targetState[5]++;
                    targetState[6] += COMMAND.payload[0] + index * 100;
                    targetState[7] = (Math.imul(targetState[7], 31) + COMMAND.sequence + COMMAND.payload[0]) | 0;
                }
            }
            targetState[4]++;
        }
        function adapterFor(targetState, capture = false) {
            return {
                save() {
                    if (capture) {
                        SIMULATION_COST.saves++;
                    }
                    return new Uint8Array(targetState.buffer.slice(0));
                },
                load(bytes) {
                    if (bytes.byteLength !== targetState.byteLength) {
                        throw new Error('Invalid snapshot shape');
                    }
                    targetState.set(
                        new Int32Array(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)),
                    );
                },
                validateSnapshot: (bytes) => bytes.byteLength === targetState.byteLength,
                step(frame) {
                    simulate(targetState, frame);
                    if (capture) {
                        SIMULATION_COST.steps++;
                        SIMULATION_COST.predicted += frame.inputs.filter((input) => input.predicted).length;
                        SIMULATION_COST.resimulated += Number(!!frame.resimulating);
                        TICK_RATES.add(frame.tickRate);
                        for (const INPUT_FRAME of frame.inputs) {
                            for (const COMMAND of INPUT_FRAME.commands) {
                                EXECUTED_COMMANDS.push({
                                    playerId: INPUT_FRAME.playerId,
                                    sequence: COMMAND.sequence,
                                    executeTick: COMMAND.executeTick,
                                    payload: [...COMMAND.payload],
                                });
                            }
                        }
                    }
                },
            };
        }
        function setChannel(channel) {
            if (channel.label === 'rollback-input') {
                inputChannel = channel;
            } else if (channel.label === 'rollback-control') {
                controlChannel = channel;
            } else {
                throw new Error('Unknown channel');
            }
            channel.binaryType = 'arraybuffer';
            channel.onerror = (event) =>
                ERRORS.push(`DataChannel ${channel.label}: ${event.error?.message || 'error'}`);
        }
        function refresh(extra = {}) {
            const RESULT = session
                ? {
                      version: VERSION,
                      mode,
                      simulationCost: {
                          ...SIMULATION_COST,
                      },
                      player: localPlayerId,
                      tick: session.tick,
                      confirmedTick: session.confirmedTick,
                      hash: session.getStateHash(),
                      state: [...STATE],
                      metrics: session.metrics,
                      channels: {
                          input: {
                              readyState: inputChannel.readyState,
                              ordered: inputChannel.ordered,
                              maxRetransmits: inputChannel.maxRetransmits,
                          },
                          control: {
                              readyState: controlChannel.readyState,
                              ordered: controlChannel.ordered,
                          },
                      },
                      connectionState: peer.connectionState,
                      ...extra,
                  }
                : {
                      player: localPlayerId,
                      connectionState: peer?.connectionState,
                      ...extra,
                  };
            document.getElementById('player').textContent = localPlayerId || '—';
            document.getElementById('tick').textContent = RESULT.tick ?? 0;
            document.getElementById('hash').textContent =
                RESULT.hash === undefined ? '—' : RESULT.hash.toString(16).padStart(8, '0');
            document.getElementById('details').textContent = JSON.stringify(RESULT, null, 2);
            return RESULT;
        }
        window.harness = {
            async createPeer(id, initiator) {
                localPlayerId = id;
                peer = new RTCPeerConnection({
                    iceServers: [],
                });
                peer.onicecandidate = (event) => {
                    if (event.candidate) {
                        CANDIDATES.push(event.candidate.toJSON());
                    }
                };
                peer.ondatachannel = (event) => setChannel(event.channel);
                if (initiator) {
                    setChannel(
                        peer.createDataChannel('rollback-input', {
                            ordered: false,
                            maxRetransmits: 0,
                        }),
                    );
                    setChannel(
                        peer.createDataChannel('rollback-control', {
                            ordered: true,
                        }),
                    );
                }
                refresh();
            },
            async offer() {
                await peer.setLocalDescription(await peer.createOffer());
                return peer.localDescription.toJSON();
            },
            async answer(offer) {
                await peer.setRemoteDescription(offer);
                await peer.setLocalDescription(await peer.createAnswer());
                return peer.localDescription.toJSON();
            },
            async acceptAnswer(answer) {
                await peer.setRemoteDescription(answer);
            },
            takeCandidates() {
                return CANDIDATES.splice(0);
            },
            async addCandidates(remoteCandidates) {
                for (const CANDIDATE of remoteCandidates) {
                    await peer.addIceCandidate(CANDIDATE);
                }
            },
            channelsOpen() {
                return inputChannel?.readyState === 'open' && controlChannel?.readyState === 'open';
            },
            start(selectedMode = 'rollback') {
                mode = selectedMode;
                if (!['rollback', 'lockstep'].includes(mode)) {
                    throw new Error('Unknown simulation mode');
                }
                if (!this.channelsOpen()) {
                    throw new Error('Both real DataChannels must be open before starting');
                }
                session = createSession({
                    players: IDS,
                    localPlayerId,
                    sessionId: 'browser-real-webrtc',
                    simulationVersion: 'integer-v1',
                    seed: 17,
                    inputSize: 1,
                    profile: {
                        ...profiles[mode === 'lockstep' ? 'lockstep' : 'action'],
                        mode,
                        tickRate: 60,
                        baseInputDelayTicks: 0,
                        minInputDelayTicks: 0,
                        maxInputDelayTicks: 8,
                        adaptiveInputDelay: false,
                        pacingPolicy: 'none',
                        rollbackWindowTicks: 12,
                        stateHistorySize: 40,
                        checksumInterval: 8,
                        maxCatchupSteps: 64,
                    },
                    adapter: adapterFor(STATE, true),
                    onEvent: (event) => EVENTS.push(event),
                });
                const TRANSPORT = new WebRTCTransport({
                    inputChannel,
                    controlChannel,
                    highWaterMark: 262144,
                    lowWaterMark: 65536,
                });
                cleanup = session.attachTransport(
                    IDS.find((id) => id !== localPlayerId),
                    TRANSPORT,
                );
                document.getElementById('status').textContent =
                    'Connected over real WebRTC. Running deterministic simulation…';
                return refresh();
            },
            step(target, count = 1) {
                const RESULTS = [];
                session.poll(performance.now());
                for (let attempt = 0; attempt < count && session.tick < target; attempt++) {
                    RESULTS.push(session.advance(input(localPlayerId, session.tick)));
                }
                return {
                    tick: session.tick,
                    confirmedTick: session.confirmedTick,
                    resimulating: session.resimulating,
                    results: RESULTS,
                };
            },
            poll() {
                session.poll(performance.now());
                return {
                    tick: session.tick,
                    confirmedTick: session.confirmedTick,
                    resimulating: session.resimulating,
                };
            },
            command(payload) {
                return session.queueCommand(new Uint8Array(payload));
            },
            report(target) {
                const SAVES_BEFORE_REPORT = SIMULATION_COST.saves;
                const UNIQUE_COMMANDS = [
                    ...new Map(
                        EXECUTED_COMMANDS.map((command) => [`${command.playerId}:${command.sequence}`, command]),
                    ).values(),
                ];
                const EXPECTED = new Int32Array(8);
                for (let tick = 0; tick < target; tick++) {
                    simulate(EXPECTED, {
                        tick,
                        tickRate: 60,
                        inputs: IDS.map((playerId) => ({
                            playerId,
                            input: input(playerId, tick),
                            commands: UNIQUE_COMMANDS.filter(
                                (command) => command.playerId === playerId && command.executeTick === tick,
                            ).map((command) => ({
                                ...command,
                                payload: new Uint8Array(command.payload),
                            })),
                        })),
                    });
                }
                const REPLAY_STATE = new Int32Array(8);
                const REPLAY = playReplay({
                    adapter: adapterFor(REPLAY_STATE),
                    replay: session.exportReplay(),
                });
                const CHECKS = {
                    actualDataChannels:
                        inputChannel.readyState === 'open' &&
                        controlChannel.readyState === 'open' &&
                        peer.connectionState === 'connected',
                    inputChannelUnreliable: inputChannel.ordered === false && inputChannel.maxRetransmits === 0,
                    controlChannelReliable: controlChannel.ordered === true,
                    oracle: [...EXPECTED].every((value, index) => value === STATE[index]),
                    fixedTickRate: TICK_RATES.size === 1 && TICK_RATES.has(60),
                    oneShotCommand: STATE[5] === 1 && STATE[6] === 17,
                    replay:
                        REPLAY.tick === target &&
                        REPLAY.hash === session.getStateHash() &&
                        [...REPLAY_STATE].every((value, index) => value === STATE[index]),
                    noBrowserErrors: ERRORS.length === 0,
                    lockstepNoPrediction:
                        mode !== 'lockstep' ||
                        (SIMULATION_COST.predicted === 0 && session.metrics.predictedTicks === 0),
                    lockstepNoRollback:
                        mode !== 'lockstep' ||
                        (SIMULATION_COST.resimulated === 0 &&
                            SIMULATION_COST.steps === target &&
                            session.metrics.rollbacks === 0 &&
                            session.metrics.recoveries === 0),
                    lockstepSparseSnapshots:
                        mode !== 'lockstep' ||
                        SAVES_BEFORE_REPORT === 1 + Math.floor(target / session.profile.checksumInterval),
                };
                const PASSED = Object.values(CHECKS).every(Boolean);
                const STATUS = document.getElementById('status');
                STATUS.textContent = PASSED
                    ? 'PASS · real WebRTC, offline oracle, command and replay agree.'
                    : 'FAIL · see checks below.';
                STATUS.className = PASSED ? 'pass' : 'fail';
                return refresh({
                    passed: PASSED,
                    checks: CHECKS,
                    expected: [...EXPECTED],
                    replay: REPLAY,
                    errors: ERRORS,
                    eventCount: EVENTS.length,
                });
            },
            close() {
                cleanup?.();
                session?.close();
                peer?.close();
            },
        };
    </script>
</html>
