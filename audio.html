      const errors = [];
      for (const record of this.records.values()) try {
        this._stop(record, "disposed");
      } catch (error) {
        errors.push(error);
      }
      this.records.clear();
      this.active.clear();
      this.awaitingConfirmation.clear();
      this.collectibleTicks.clear();
      this.rollbackFrom = null;
      if (errors.length) throw new AggregateError(errors, "presentation cleanup failed");
    }
  };

  // modules/audio/examples/modules/audio/examples/index.html
  var config = { storageKey: "gamekit-audio-example", maxVoices: 4, categories: { impact: { volume: 1, max: 3, gapMs: 0, priority: 1 }, danger: { volume: 0.8, max: 3, gapMs: 0, priority: 5 } }, sounds: {
    hit: { category: "impact", layers: [{ kind: "tone", hz: 180, end: 50, ms: 260, gain: 0.22, type: "sine" }, { kind: "noise", hz: 2200, ms: 80, gain: 0.13 }] },
    warning: { category: "danger", priority: 8, layers: [{ kind: "tone", hz: 660, end: 880, ms: 300, gain: 0.18, type: "triangle" }] }
  } };
  var player = new AudioPlayer(config);
  var tick = 0;
  var journal = new PresentationEventQueue({ adapters: { sfx: player.createAdapter({ onEnded: (event) => journal.finish(event) }) } });
  var status = () => {
    document.querySelector("#status").textContent = JSON.stringify(player.snapshot(), null, 2);
    document.querySelector("#volume").value = Math.round(player.volume * 100);
    document.querySelector("#mute").textContent = player.muted ? "음소거 해제" : "음소거";
  };
  document.querySelector("#tap").onclick = async () => {
    await player.unlock();
    player.play("hit");
    status();
    setTimeout(status, 400);
  };
  document.querySelector("#confirmed").onclick = async () => {
    await player.unlock();
    const event = { tick: tick++, sequence: 0, entityId: "demo", generation: 0, kind: "sfx", payload: { soundId: "hit" }, policy: "confirmed" };
    journal.emit(event);
    journal.confirmThrough(event.tick);
    journal.emit(event);
    status();
    setTimeout(status, 400);
  };
  document.querySelector("#dense").onclick = async () => {
    await player.unlock();
    for (let i = 0; i < 20; i++) player.play("hit");
    for (let i = 0; i < 3; i++) player.play("warning");
    status();
    setTimeout(status, 450);
  };
  document.querySelector("#mute").onclick = () => {
    player.setMuted(!player.muted);
    status();
  };
  document.querySelector("#volume").oninput = (e) => {
    player.setVolume(Number(e.target.value) / 100);
    status();
  };
  window.audioExample = { player, journal, config };
  window.addEventListener("pagehide", () => {
    journal.dispose();
    void player.dispose();
  });
  status();
})();

</script></html>
