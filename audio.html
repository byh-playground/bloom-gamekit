    STATUS();
  };
  window.audioExample = {
    player: PLAYER,
    journal: JOURNAL,
    config: CONFIG
  };
  window.addEventListener("pagehide", () => {
    JOURNAL.dispose();
    void PLAYER.dispose();
  });
  STATUS();
})();

</script>
</html>
