<!doctype html>
<html lang="ko">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>광고 어댑터 실제 확인 · bloom-gamekit</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font:
                16px system-ui,
                sans-serif;
            max-width: 720px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            background: #111c24;
            color: #e6f1f3;
            line-height: 1.55;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 0.5rem;
        }
        ul {
            padding-left: 1.2rem;
            color: #aebfc6;
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin: 1rem 0 0.4rem;
        }
        input,
        button {
            width: 100%;
            min-height: 56px;
            font: inherit;
            border-radius: 10px;
            border: 1px solid #40535e;
            background: #1b2c37;
            color: inherit;
            padding: 0 0.8rem;
        }
        button {
            margin-top: 0.6rem;
            background: #2b6f86;
            border-color: #3f8fa8;
            font-weight: 600;
        }
        button:disabled {
            opacity: 0.45;
        }
        .notice {
            margin: 0.6rem 0 0;
            color: #f0c674;
            min-height: 1.5em;
        }
        pre {
            padding: 1rem;
            background: #091117;
            border: 1px solid #40535e;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 0.85rem;
        }
    </style>
    <h1>광고 어댑터 실제 확인</h1>
    <p>게시자 ID를 넣으면 실제 Google 테스트 광고로 bm 어댑터를 확인합니다. 이 페이지는 항상 테스트 모드입니다.</p>
    <ul>
        <li>승인된 AdSense 계정과 H5 Games Ads 베타가 있어야 광고가 나옵니다.</li>
        <li>승인된 사이트의 도메인에서 열어야 합니다. 미리보기 주소에서는 광고가 나오지 않을 수 있습니다.</li>
        <li>광고가 없으면 결과는 unavailable입니다. 보상은 rewarded일 때만 올라갑니다.</li>
    </ul>
    <label for="publisher">게시자 ID</label>
    <input id="publisher" inputmode="text" autocomplete="off" placeholder="ca-pub-1234567890123456" />
    <button id="connect">연결</button>
    <p class="notice" id="notice"></p>
    <button id="rewarded" disabled>광고 보고 보상 받기</button>
    <button id="interstitial" disabled>전면 광고 (다음 단계로)</button>
    <pre id="output"></pre>
    <pre id="log"></pre>
    <script>
(() => {
  // dist/bm.js
  var EVENTS = Object.freeze(["adstart", "adend"]);
  var OUTCOMES = Object.freeze({
    rewarded: Object.freeze(["rewarded", "dismissed", "unavailable", "error"]),
    interstitial: Object.freeze(["viewed", "dismissed", "unavailable", "error"])
  });
  var SHOWN = Object.freeze(["rewarded", "viewed", "dismissed"]);
  function defaultIsUserActive() {
    const ACTIVATION = globalThis.navigator?.userActivation;
    return ACTIVATION ? ACTIVATION.isActive : true;
  }
  function checkCount(value, name) {
    if (value !== Infinity && (!Number.isSafeInteger(value) || value < 0)) {
      throw new RangeError(`bm policy.${name} must be a non-negative safe integer or Infinity.`);
    }
  }
  function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
      const TIMER = setTimeout(() => reject(new Error("bm adapter show timed out.")), ms);
      promise.then(
        (value) => {
          clearTimeout(TIMER);
          resolve(value);
        },
        (error) => {
          clearTimeout(TIMER);
          reject(error);
        }
      );
    });
  }
  function createBm({
    adapter,
    policy = {},
    showTimeoutMs = 12e4,
    requireUserActivation = true,
    isUserActive = defaultIsUserActive,
    now = () => Date.now()
  } = {}) {
    if (!adapter || typeof adapter.id !== "string" || typeof adapter.load !== "function" || typeof adapter.show !== "function") {
      throw new TypeError("bm adapter must provide id, load() and show().");
    }
    const {
      interstitialCooldownMs: COOLDOWN_MS = 6e4,
      interstitialPerSession: INTERSTITIAL_CAP = Infinity,
      rewardedPerSession: REWARDED_CAP = Infinity
    } = policy;
    if (!Number.isFinite(COOLDOWN_MS) || COOLDOWN_MS < 0) {
      throw new RangeError("bm policy.interstitialCooldownMs must be a non-negative finite number.");
    }
    checkCount(INTERSTITIAL_CAP, "interstitialPerSession");
    checkCount(REWARDED_CAP, "rewardedPerSession");
    if (!Number.isFinite(showTimeoutMs) || showTimeoutMs <= 0) {
      throw new RangeError("bm showTimeoutMs must be a positive finite number.");
    }
    const LIMITS = { rewarded: REWARDED_CAP, interstitial: INTERSTITIAL_CAP };
    const LISTENERS = { adstart: /* @__PURE__ */ new Set(), adend: /* @__PURE__ */ new Set() };
    const SHOWN_COUNT = { rewarded: 0, interstitial: 0 };
    let busy = false;
    let disposed = false;
    let lastAdEndedAt = -Infinity;
    function emit(event, payload) {
      for (const LISTENER of [...LISTENERS[event]]) {
        try {
          LISTENER(payload);
        } catch (error) {
          queueMicrotask(() => {
            throw error;
          });
        }
      }
    }
    function check(type) {
      if (!(type in LIMITS)) {
        throw new TypeError(`bm ad type must be 'rewarded' or 'interstitial': ${type}`);
      }
      if (disposed) {
        return { ok: false, reason: "disposed" };
      }
      if (busy) {
        return { ok: false, reason: "busy" };
      }
      if (SHOWN_COUNT[type] >= LIMITS[type]) {
        return { ok: false, reason: "session-cap" };
      }
      if (type === "interstitial") {
        const WAIT = lastAdEndedAt + COOLDOWN_MS - now();
        if (WAIT > 0) {
          return { ok: false, reason: "cooldown", retryAfterMs: WAIT };
        }
      }
      return { ok: true };
    }
    async function show(type, placement) {
      const GATE = check(type);
      if (!GATE.ok) {
        return { status: "blocked", type, placement, reason: GATE.reason };
      }
      if (requireUserActivation && !isUserActive()) {
        return { status: "blocked", type, placement, reason: "no-user-activation" };
      }
      busy = true;
      emit("adstart", { type, placement });
      const RESULT = { status: "error", type, placement };
      try {
        const OUTCOME = await withTimeout(Promise.resolve(adapter.show(placement, type)), showTimeoutMs);
        if (OUTCOMES[type].includes(OUTCOME)) {
          RESULT.status = OUTCOME;
        } else {
          RESULT.reason = "invalid-outcome";
        }
      } catch (error) {
        RESULT.reason = "adapter-failed";
        RESULT.error = error;
      }
      busy = false;
      if (SHOWN.includes(RESULT.status)) {
        SHOWN_COUNT[type]++;
        lastAdEndedAt = now();
      }
      emit("adend", RESULT);
      return RESULT;
    }
    return {
      /** @returns {string} 연결된 어댑터 id */
      get adapterId() {
        return adapter.id;
      },
      /** 세션 동안 실제로 나온 광고 수와 마지막 광고 종료 시각입니다. 읽을 때만 새 객체를 만듭니다. */
      get stats() {
        return { shown: { ...SHOWN_COUNT }, lastAdEndedAt };
      },
      /**
       * 어댑터가 광고를 미리 준비합니다. 실패는 false로 돌려주며 던지지 않습니다.
       * @param {string} placement
       * @param {'rewarded' | 'interstitial'} [type='rewarded']
       * @returns {Promise<boolean>}
       */
      async preload(placement, type = "rewarded") {
        check(type);
        try {
          return await adapter.load(placement, type) === true;
        } catch {
          return false;
        }
      },
      /** 정책만 검사합니다. 사용자 입력 직후 여부는 show 시점에 판정합니다. */
      canShow(type) {
        return check(type);
      },
      /** 사용자가 직접 누른 입력 처리 안에서 호출합니다. 보상은 status가 'rewarded'일 때만 지급하세요. */
      showRewarded(placement) {
        return show("rewarded", placement);
      },
      showInterstitial(placement) {
        return show("interstitial", placement);
      },
      /**
       * @param {'adstart' | 'adend'} event
       * @param {(payload: object) => void} listener
       * @returns {() => void} 구독 해제
       */
      on(event, listener) {
        if (!EVENTS.includes(event)) {
          throw new TypeError(`bm event must be one of ${EVENTS.join(", ")}: ${event}`);
        }
        if (typeof listener !== "function") {
          throw new TypeError("bm listener must be a function.");
        }
        LISTENERS[event].add(listener);
        return () => LISTENERS[event].delete(listener);
      },
      /** 반복 호출할 수 있습니다. 이후 광고 요청은 'disposed'로 막힙니다. */
      dispose() {
        if (disposed) {
          return;
        }
        disposed = true;
        LISTENERS.adstart.clear();
        LISTENERS.adend.clear();
        adapter.dispose?.();
      }
    };
  }

  // dist/bm-google-ads.js
  var SCRIPT_URL = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js";
  var INTERSTITIAL_TYPES = Object.freeze(["next", "start", "pause", "browse"]);
  function outcomeFromStatus(type, status) {
    if (status === "viewed") {
      return type === "rewarded" ? "rewarded" : "viewed";
    }
    if (status === "dismissed") {
      return "dismissed";
    }
    return status === "error" ? "error" : "unavailable";
  }
  function createGoogleAdsAdapter({
    clientId,
    testMode = false,
    sound = "on",
    interstitialType = "next",
    loadScript = true,
    readyTimeoutMs = 5e3,
    onRewardReady = null
  } = {}) {
    if (typeof clientId !== "string" || !/^ca-pub-\d+$/.test(clientId)) {
      throw new TypeError("google-ads clientId must look like 'ca-pub-123456789'.");
    }
    if (!INTERSTITIAL_TYPES.includes(interstitialType)) {
      throw new TypeError(`google-ads interstitialType must be one of ${INTERSTITIAL_TYPES.join(", ")}.`);
    }
    let ready = false;
    let readyPromise = null;
    function ensureReady() {
      readyPromise ??= new Promise((resolve) => {
        globalThis.adsbygoogle = globalThis.adsbygoogle || [];
        if (typeof globalThis.adBreak !== "function") {
          const PUSH = (options) => globalThis.adsbygoogle.push(options);
          globalThis.adBreak = PUSH;
          globalThis.adConfig = PUSH;
        }
        if (loadScript && !document.querySelector(`script[src^="${SCRIPT_URL}"]`)) {
          const SCRIPT = document.createElement("script");
          SCRIPT.async = true;
          SCRIPT.crossOrigin = "anonymous";
          SCRIPT.src = `${SCRIPT_URL}?client=${encodeURIComponent(clientId)}`;
          if (testMode) {
            SCRIPT.setAttribute("data-adbreak-test", "on");
          }
          SCRIPT.onerror = () => resolve(false);
          document.head.append(SCRIPT);
        }
        const TIMER = setTimeout(() => resolve(false), readyTimeoutMs);
        globalThis.adConfig({
          sound,
          preloadAdBreaks: "on",
          onReady() {
            ready = true;
            clearTimeout(TIMER);
            resolve(true);
          }
        });
      });
      return readyPromise;
    }
    return {
      id: "google-ads",
      /** SDK 준비 여부를 돌려줍니다. 광고 한 편이 준비됐는지는 Google이 알려 주지 않습니다. */
      async load() {
        await ensureReady();
        return ready;
      },
      show(placement, type) {
        ensureReady();
        return new Promise((resolve) => {
          let outcome = null;
          const OPTIONS = {
            type: type === "rewarded" ? "reward" : interstitialType,
            name: placement,
            beforeAd() {
              outcome = type === "rewarded" ? outcome : "viewed";
            },
            adBreakDone(info) {
              resolve(outcome ?? outcomeFromStatus(type, info?.breakStatus));
            }
          };
          if (type === "rewarded") {
            OPTIONS.beforeReward = (showAdFn) => {
              if (onRewardReady) {
                onRewardReady(showAdFn);
              } else {
                showAdFn();
              }
            };
            OPTIONS.adViewed = () => {
              outcome = "rewarded";
            };
            OPTIONS.adDismissed = () => {
              outcome = "dismissed";
            };
          }
          globalThis.adBreak(OPTIONS);
        });
      }
    };
  }

  // modules/bm/examples/modules/bm/examples/index.html
  var LOG = [];
  var NOTICE = document.querySelector("#notice");
  var INPUT = document.querySelector("#publisher");
  var BUTTONS = [document.querySelector("#rewarded"), document.querySelector("#interstitial")];
  var bm = null;
  var sdkReady = null;
  var rewards = 0;
  var last = null;
  function log(line) {
    LOG.unshift(line);
    LOG.length = Math.min(LOG.length, 10);
    document.querySelector("#log").textContent = LOG.join("\n");
  }
  function render() {
    const REWARDED = bm?.canShow("rewarded"), INTERSTITIAL = bm?.canShow("interstitial"), SUMMARY = (gate) => !gate ? "-" : gate.ok ? "ok" : gate.reason;
    document.querySelector("#output").textContent = JSON.stringify(
      {
        connected: bm !== null,
        sdkReady,
        rewards,
        shown: bm?.stats.shown ?? null,
        canShow: { rewarded: SUMMARY(REWARDED), interstitial: SUMMARY(INTERSTITIAL) },
        last
      },
      null,
      2
    );
  }
  async function connect() {
    const CLIENT_ID = INPUT.value.trim();
    if (!/^ca-pub-\d+$/.test(CLIENT_ID)) {
      NOTICE.textContent = "게시자 ID는 'ca-pub-' 뒤에 숫자가 붙은 형태입니다.";
      return;
    }
    NOTICE.textContent = "";
    bm?.dispose();
    bm = createBm({
      adapter: createGoogleAdsAdapter({ clientId: CLIENT_ID, testMode: true }),
      policy: { interstitialCooldownMs: 0 }
    });
    bm.on("adstart", ({ type, placement }) => log(`adstart ${type}/${placement}`));
    bm.on("adend", ({ status, reason }) => log(`adend ${status}${reason ? " (" + reason + ")" : ""}`));
    sdkReady = await bm.preload("entry");
    if (!sdkReady) {
      NOTICE.textContent = "SDK가 준비되지 않았습니다. 승인된 도메인인지, 광고 차단이 꺼져 있는지 확인하세요.";
    }
    for (const BUTTON of BUTTONS) {
      BUTTON.disabled = false;
    }
    render();
  }
  async function run(type) {
    const RESULT = await (type === "rewarded" ? bm.showRewarded("entry") : bm.showInterstitial("next"));
    if (RESULT.status === "rewarded") {
      rewards++;
    }
    last = { type: RESULT.type, status: RESULT.status, reason: RESULT.reason ?? null };
    render();
  }
  document.querySelector("#connect").addEventListener("click", connect);
  BUTTONS[0].addEventListener("click", () => run("rewarded"));
  BUTTONS[1].addEventListener("click", () => run("interstitial"));
  var FROM_HASH = location.hash.slice(1);
  if (/^ca-pub-\d+$/.test(FROM_HASH)) {
    INPUT.value = FROM_HASH;
  }
  setInterval(render, 500);
  render();
  window.bmExample = { connect };
})();

</script>
</html>
