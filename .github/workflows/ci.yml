name: gamekit CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        name: Build distributable modules
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
        steps:
            # https://github.com/actions/checkout/releases/tag/v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # https://github.com/actions/setup-node/releases/tag/v7.0.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Require source-only checkout
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -n "$(git ls-files -- dist/ interpolation.js rendering.js input.js deterministic.js simloop.js work-scheduler.js transport.js replay.js rollback.js rollback-netcode.js camera.js presentation-events.js hud.js debug-tools.js audio.js navigation.js scenario.js object-pool.js pixel-physics.js pixel-physics-matter.js manifest.json)" ]; then
                    echo 'Generated bundles belong only on the dist branch.' >&2
                    exit 1
                  fi
            - name: Install locked build tooling without lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund
            - name: Canonicalize showcase host (temporary)
              shell: bash
              run: |
                  npx eslint --fix modules/scenario/showcase-host.js || true
                  node --input-type=module <<'SHOWCASE_CLEAN'
                  import fs from 'node:fs';
                  import * as espree from 'espree';
                  import * as scopeLib from 'eslint-scope';
                  const PATH='modules/scenario/showcase-host.js';
                  let text=fs.readFileSync(PATH,'utf8');
                  const ast=espree.parse(text,{ecmaVersion:'latest',sourceType:'module',range:true});
                  const scope=scopeLib.analyze(ast,{ecmaVersion:2022,sourceType:'module',ignoreEval:true});
                  const edits=new Map();
                  const shorthand=new Set();
                  function visit(node,parent){
                    if(!node||typeof node!=='object')return;
                    if(Array.isArray(node)){for(const item of node)visit(item,parent);return;}
                    if(node.type==='Identifier' && parent?.type==='Property' && parent.shorthand && parent.value?.range?.[0]===node.range?.[0]) shorthand.add(node.range[0]+'-'+node.range[1]);
                    if(!node.type)return;
                    for(const [key,value] of Object.entries(node)) if(key!=='parent'&&key!=='range'&&key!=='loc'&&value&&typeof value==='object')visit(value,node);
                  }
                  visit(ast,null);
                  for(const scopeNode of scope.scopes){
                   for(const variable of scopeNode.variables){
                    if(!variable.defs?.some(def=>def.parent?.kind==='const')||/^[A-Z][A-Z0-9_]*$/.test(variable.name))continue;
                    const renamed=variable.name.replace(/([a-z0-9])([A-Z])/g,'$1_$2').replace(/([A-Z])([A-Z][a-z])/g,'$1_$2').toUpperCase();
                    for(const id of [...variable.defs.map(def=>def.name), ...variable.references.map(ref=>ref.identifier)]){
                     if(!id?.range)continue;
                     const k=id.range[0]+'-'+id.range[1];
                     edits.set(k,{start:id.range[0],end:id.range[1],text:shorthand.has(k)?variable.name+': '+renamed:renamed});
                    }
                   }
                  }
                  for(const e of [...edits.values()].sort((a,b)=>b.start-a.start))text=text.slice(0,e.start)+e.text+text.slice(e.end);
                  fs.writeFileSync(PATH,text);
                  console.error('RENAMED_CONST_REFERENCES='+edits.size);
                  SHOWCASE_CLEAN
                  npx prettier --write modules/scenario/showcase-host.js
                  echo CANON_BEGIN
                  base64 -w0 modules/scenario/showcase-host.js
                  echo
                  echo CANON_END
            - name: Build independent bundles
              run: npm run build
            - name: Build standalone HTML previews
              run: npm run build:previews
            - name: Reject changed bytes under an existing version
              run: npm run verify:release
            - name: Verify generated manifest and bundle bytes
              id: manifest
              shell: bash
              run: |
                  set -euo pipefail
                  manifest="$(node project/verify-dist.mjs)"
                  echo "sha256=$manifest" >> "$GITHUB_OUTPUT"

    publish-dist:
        name: Update dist branch
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'byh-playground/bloom-gamekit'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        concurrency:
            group: publish-dist
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Install locked tooling without lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund
            # Artifact 저장소 없이 같은 source를 재빌드하고 검사 job의 hash와 대조합니다.
            - name: Rebuild the tested source
              run: npm run build
            - name: Build standalone HTML previews
              run: npm run build:previews
            - name: Publish the verified modules and manifest to dist
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
              run: node project/publish-dist.mjs
