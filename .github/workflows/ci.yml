name: gamekit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build distributable modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require source-only checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files -- dist/ interpolation.js rendering.js input.js deterministic.js simloop.js transport.js replay.js rollback.js rollback-netcode.js camera.js presentation-events.js hud.js debug-tools.js manifest.json)" ]; then
            echo 'Generated bundles belong only on the dist branch.' >&2
            exit 1
          fi
      - name: Install locked build tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build independent bundles
        run: npm run build
      - name: Verify generated manifest and bundle bytes
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(node scripts/verify-dist.mjs)"
          echo "sha256=$manifest" >> "$GITHUB_OUTPUT"

  publish-dist:
    name: Update dist branch
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'byh-playground/bloom-gamekit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Artifact 저장소 없이 같은 source를 재빌드하고 검사 job의 hash와 대조합니다.
      - name: Rebuild the tested source
        run: npm run build
      - name: Publish the verified modules and manifest to dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: node scripts/publish-dist.mjs
