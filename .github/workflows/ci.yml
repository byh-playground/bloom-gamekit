name: gamekit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build distributable modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require source-only checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files -- dist/ interpolation.js rendering.js input.js deterministic.js simloop.js transport.js replay.js rollback.js rollback-netcode.js camera.js presentation-events.js hud.js debug-tools.js audio.js navigation.js scenario.js object-pool.js manifest.json)" ]; then
            echo 'Generated bundles belong only on the dist branch.' >&2
            exit 1
          fi
      - name: Install locked build tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser scenarios
        run: npx playwright install --with-deps chromium
      - name: Build independent bundles
        run: npm run build
      - name: Build standalone HTML previews
        run: npm run build:previews
      - name: Run core browser-backed scenarios
        run: npm test
      - name: Run 3D vector rendering browser scenarios
        run: npm run test:vector-assets:world-rendering
      - name: Reject changed bytes under an existing version
        run: npm run verify:release
      - name: Verify generated manifest and bundle bytes
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(node project/verify-dist.mjs)"
          echo "sha256=$manifest" >> "$GITHUB_OUTPUT"
      - name: Retain Farmpea vector example screenshot
        if: always()
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-assets-quality-farmpea
          path: test-results/vector-assets-quality-farmpea.png
          if-no-files-found: ignore
          retention-days: 7

  publish-dist:
    name: Update dist branch
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'byh-playground/bloom-gamekit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Artifact 저장소 없이 같은 source를 재빌드하고 검사 job의 hash와 대조합니다.
      - name: Rebuild the tested source
        run: npm run build
      - name: Build standalone HTML previews
        run: npm run build:previews
      - name: Publish the verified modules and manifest to dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: node project/publish-dist.mjs
