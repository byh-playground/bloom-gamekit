<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tech tree example</title>
<style>
    html,
    body {
        margin: 0;
        height: 100%;
        background: #151a2c;
        color: #e8eefc;
        font:
            14px/1.4 system-ui,
            sans-serif;
    }
    main {
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-sizing: border-box;
        height: 100%;
        padding: 10px;
    }
    h1 {
        margin: 0;
        font-size: 18px;
    }
    p {
        margin: 0;
        opacity: 0.8;
    }
    .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
    }
    .bar button {
        min-height: 56px;
        padding: 0 16px;
        border: 2px solid #4a5a86;
        border-radius: 12px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
    }
    .bar button[aria-pressed='true'] {
        border-color: #ffd166;
        background: #ffd166;
        color: #1b2238;
    }
    #points {
        margin-left: auto;
        font-weight: 700;
    }
    #tech {
        flex: 1;
        min-height: 360px;
    }
</style>
<main>
    <h1>성장 트리</h1>
    <p>선행 조건만 적으면 배치·상태·상세가 만들어집니다. 큰 트리는 끌고 확대해서 봅니다.</p>
    <div class="bar">
        <button id="tab-stats" type="button" aria-pressed="true">스탯 트리</button>
        <button id="tab-big" type="button" aria-pressed="false">큰 트리</button>
        <button id="more" type="button">+3 포인트</button>
        <button id="reset" type="button">처음부터</button>
        <span id="points" aria-live="polite"></span>
    </div>
    <div id="tech"></div>
</main>
