        font:

            sans-serif;
    }
    main {
        max-width: 960px;
        margin: 0 auto;
        padding: 10px 14px 24px;
    }
    h1 {
        margin: 4px 0 6px;
        font-size: 20px;
    }
    p,
    li {
        color: #a9bdcb;
        line-height: 1.5;
    }
    p {
        margin: 6px 0;
    }
    ul {
        margin: 6px 0;
        padding-left: 20px;
    }
    .controls {
        display: flex;
        gap: 10px;
        margin: 10px 0;
    }
    button {
        flex: 1;
        min-height: 56px;
        border: 1px solid #526374;
        border-radius: 12px;
        background: #1b2a38;
        color: #dce8f1;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
    }
    button[aria-pressed='true'] {
        border-color: #8fd0ea;
        background: #2f6f8f;
    }
    canvas {
        display: block;
        width: min(100%, calc((100vh - 240px) * 1.8));
        min-width: 240px;
        height: auto;
        margin: 0 auto;
        border: 1px solid #526374;
        border-radius: 12px;
    }
</style>
<main>
    <h1>텍스처 어레이로 그리기</h1>
    <p>
        아틀라스 페이지가 달라도 텍스처 어레이 하나를 바인딩하면 한 번에 그립니다. 페이지마다 텍스처를 따로 쓰면
        페이지가 바뀔 때마다 그리기 호출이 나뉩니다.
    </p>
    <div class="controls">
        <button id="mode-array" type="button" aria-pressed="true">텍스처 어레이 1개</button>
        <button id="mode-separate" type="button" aria-pressed="false">페이지별 텍스처 4개</button>
    </div>
    <canvas id="scene" width="720" height="400"></canvas>
    <p id="stats" aria-live="polite"></p>
    <ul>
        <li>스프라이트는 페이지를 번갈아 가며 같은 순서로 그리므로 두 방식의 화면은 같습니다.</li>
        <li>어레이의 모든 레이어는 같은 크기이고 남는 영역은 투명입니다.</li>
        <li>어레이는 쓰는 면적과 관계없이 레이어 전체 메모리를 처음에 할당합니다.</li>
        <li>mesh가 다르면 어레이여도 그리기 호출이 나뉩니다.</li>
    </ul>

  BUTTONS.separate.addEventListener("click", () => EXAMPLE.setMode("separate"));
  EXAMPLE.setMode("array");
  window.textureArrayExample = EXAMPLE;
  window.addEventListener(
    "pagehide",
    () => {
      ARRAY_SPRITES.dispose();
      SEPARATE_SPRITES.forEach((sprites) => sprites.dispose());
      MESHES.dispose();
      DEVICE.dispose();
    },
    { once: true }
  );
})();

</script>
